<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Підключаємо A-Frame та AR.js (або MindAR, залежно від твоюї збірки) -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      /* CSS для плавного зникання та появи відео */
      .fade-video {
        transition: opacity 0.5s ease-in-out;
        opacity: 0;
      }
      .fade-video.visible {
        opacity: 1;
      }
    </style>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Завантаження ресурсів -->
      <a-assets>
        <!-- Твоє нове відео -->
        <video 
          id="ar-video" 
          src="https://files.catbox.moe/gswdrf.mov" 
          preload="auto" 
          loop="true" 
          crossorigin="anonymous"
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <!-- Маркер (заміни patternUrl на свій файл `.patt` або використовуй стандартний hiro) -->
      <a-marker type="pattern" url="targets/marker.patt" id="marker">
        <!-- Площина, на яку накладається відео з прозорістю -->
        <a-video 
          src="#ar-video" 
          width="1.6" 
          height="0.9" 
          position="0 0 0" 
          rotation="-90 0 0"
          material="opacity: 0; transparent: true;">
        </a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <!-- Скрипт керування відтворенням та анімацією -->
    <script>
      const marker = document.querySelector('#marker');
      const video = document.querySelector('#ar-video');
      const aVideo = document.querySelector('a-video');

      let fadeInterval;

      // Коли камера знаходить фото-маркер
      marker.addEventListener('markerFound', () => {
        video.play();
        fadeMaterial(aVideo, 0, 1, 500); // Плавна поява за 500 мс
      });

      // Коли камера втрачає фото-маркер
      marker.addEventListener('markerLost', () => {
        fadeMaterial(aVideo, 1, 0, 500, () => {
          video.pause(); // Ставимо на паузу після повного зникання
        });
      });

      // Функція для зміни прозорості (Fade Effect)
      function fadeMaterial(element, startOpacity, endOpacity, duration, onComplete) {
        clearInterval(fadeInterval);
        const startTime = performance.now();

        fadeInterval = setInterval(() => {
          const elapsedTime = performance.now() - startTime;
          const progress = Math.min(elapsedTime / duration, 1);
          
          // Обчислюємо поточну прозорість
          const currentOpacity = startOpacity + (endOpacity - startOpacity) * progress;
          element.setAttribute('material', 'opacity', currentOpacity);

          if (progress >= 1) {
            clearInterval(fadeInterval);
            if (onComplete) onComplete();
          }
        }, 16); // ~60fps
      }
    </script>
  </body>
</html>
