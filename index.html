<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    /* Невеликий напис із поточним часом знизу */
    #version-label {
      position: fixed;
      bottom: 5px;
      right: 10px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 10px;
      font-family: monospace;
      pointer-events: none;
      z-index: 999;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div id="version-label">04:35</div>

  <!-- Відео з додатковими атрибутами для мобільних -->
  <video id="my-video" src="https://files.catbox.moe/vyigmo.mp4" preload="auto" crossorigin="anonymous" webkit-playsinline playsinline muted loop></video>

  <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <item id="target-asset" src="targets.mind"></item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Ціль розпізнавання зображення -->
    <a-entity mindar-image-target="targetIndex: 0" id="mindar-image-target">
      <a-plane src="#my-video" position="0 0 0" height="1.33" width="0.75" rotation="0 0 0"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const videoElement = document.querySelector('#my-video');
    const targetEntity = document.querySelector('#mindar-image-target');

    // Розблокування відео першим дотиком до екрана (потрібно для мобільних браузерів)
    window.addEventListener('click', () => {
      if (videoElement.paused) {
        videoElement.play().catch(e => console.log("Play prevented:", e));
        videoElement.pause();
      }
    }, { once: true });

    targetEntity.addEventListener('targetFound', event => {
      videoElement.play().catch(error => {
        console.log("Error playing video:", error);
      });
    });

    targetEntity.addEventListener('targetLost', event => {
      videoElement.pause();
    });
  </script>
</body>
</html>
