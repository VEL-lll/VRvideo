<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebAR Stable Spatial Audio</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      #start-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 15, 20, 0.95);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        cursor: pointer;
        transition: opacity 0.4s ease;
      }
      #start-btn {
        background: linear-gradient(135deg, #00c6ff, #0072ff);
        color: white;
        border: none;
        padding: 16px 36px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 30px;
        box-shadow: 0 8px 25px rgba(0, 114, 255, 0.4);
        cursor: pointer;
      }
      #start-hint {
        margin-top: 14px;
        font-size: 13px;
        opacity: 0.75;
      }

      /* Підказка для сканування */
      #scan-instruction {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9998;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 10px 22px;
        border-radius: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 500;
        pointer-events: none;
        transition: opacity 0.4s ease;
        opacity: 0;
        letter-spacing: 0.3px;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      #scan-instruction.visible {
        opacity: 1;
      }

      /* Кнопка керування звуком */
      #sound-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: background 0.2s;
      }
      #sound-toggle:active {
        background: rgba(255, 255, 255, 0.3);
      }

      #time-badge {
        position: fixed;
        bottom: 12px;
        right: 16px;
        z-index: 9999;
        color: rgba(255, 255, 255, 0.95);
        font-family: monospace;
        font-size: 14px;
        font-weight: bold;
        pointer-events: none;
        letter-spacing: 0.5px;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    
    <div id="start-overlay">
      <button id="start-btn">▶ Запустити AR</button>
      <div id="start-hint">(натисніть для активації камери та звуку)</div>
    </div>

    <div id="scan-instruction">📍 Наведіть камеру на зображення</div>
    <div id="sound-toggle">🔇</div>
    <div id="time-badge">07:51 | Fixed Audio</div>

    <!-- Фільтри проти тремтіння (jitter) -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.001; filterBeta: 10; warmupTolerance: 5; missTolerance: 10;" 
             color-space="sRGB" 
             renderer="colorManagement: true; antialias: false; precision: mediump;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="my-video" src="https://files.catbox.moe/y5fotd.mp4" preload="auto" crossorigin="anonymous" webkit-playsinline playsinline loop muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="ar-target">
        <a-plane id="video-plane" src="#my-video" position="0 0 0" height="1.33" width="0.75" 
                 rotation="0 0 0" scale="1 1 1"
                 material="shader: flat; transparent: true; opacity: 0;"
                 animation__fadein="property: material.opacity; to: 1; dur: 800; easing: easeInOutCubic; startEvents: showVideo"
                 animation__fadeout="property: material.opacity; to: 0; dur: 500; easing: easeInOutCubic; startEvents: hideVideo">
        </a-plane>
      </a-entity>
      
    </a-scene>

    <script>
      const overlay = document.querySelector("#start-overlay");
      const videoElement = document.querySelector("#my-video");
      const targetEntity = document.querySelector('#ar-target');
      const videoPlane = document.querySelector("#video-plane");
      const scanInstruction = document.querySelector("#scan-instruction");
      const soundToggle = document.querySelector("#sound-toggle");

      let fadeOutTimeout = null;
      let isUnlocked = false;
      let isUserMuted = false;

      let initialDistance = 0;
      let baseScale = 1;
      let currentScale = 1;

      // Web Audio API для стабільного об'ємного звуку без втрати гучності
      let audioCtx = null;
      let pannerNode = null;
      let sourceNode = null;
      let targetWorldPos = new THREE.Vector3();

      function initSpatialAudio() {
        if (audioCtx) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
          
          sourceNode = audioCtx.createMediaElementSource(videoElement);
          pannerNode = audioCtx.createPanner();
          
          // Налаштування: панорамування є, але затухання за дистанцією вимкнено (гучність завжди 100%)
          pannerNode.panningModel = 'HRTF';
          pannerNode.distanceModel = 'linear';
          pannerNode.refDistance = 1;
          pannerNode.maxDistance = 10000;
          pannerNode.rolloffFactor = 0; // Робить звук стабільним на будь-якій відстані!

          sourceNode.connect(pannerNode);
          pannerNode.connect(audioCtx.destination);
        } catch (e) {
          console.log("Spatial audio init warning:", e);
        }
      }

      function updateAudioPosition() {
        if (pannerNode && targetEntity) {
          targetEntity.object3D.getWorldPosition(targetWorldPos);
          pannerNode.positionX.value = targetWorldPos.x;
          pannerNode.positionY.value = targetWorldPos.y;
          pannerNode.positionZ.value = targetWorldPos.z;
        }
        requestAnimationFrame(updateAudioPosition);
      }

      // Клік по стартовому екрану — тільки розблокування, звук НЕ грає до пошуку мітки
      overlay.addEventListener("click", () => {
        isUnlocked = true;
        videoElement.muted = true; // Запускаємо беззвучно для розблокування мобільним браузером

        initSpatialAudio();
        requestAnimationFrame(updateAudioPosition);

        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.style.display = "none";
        }, 400);

        scanInstruction.classList.add("visible");
        soundToggle.style.display = "flex";
        soundToggle.textContent = "🔊";

        videoElement.play().then(() => {
          videoElement.pause();
          videoElement.currentTime = 0;
        }).catch(err => console.log("Unlock error:", err));
      });

      // Кнопка звуку
      soundToggle.addEventListener("click", () => {
        isUserMuted = !isUserMuted;
        videoElement.muted = isUserMuted;
        soundToggle.textContent = isUserMuted ? "🔇" : "🔊";
      });

      // Знайшли мітку — запускаємо і звук, і відео одночасно!
      targetEntity.addEventListener("targetFound", () => {
        if (!isUnlocked) return;
        if (fadeOutTimeout) clearTimeout(fadeOutTimeout);
        
        scanInstruction.classList.remove("visible");
        
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        videoElement.muted = isUserMuted;
        const playPromise = videoElement.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => console.log("Play error:", err));
        }
        videoPlane.emit("showVideo");
      });
      
      // Втратили мітку — плавно ховаємо і ставимо на паузу
      targetEntity.addEventListener("targetLost", () => {
        if (!isUnlocked) return;
        
        scanInstruction.classList.add("visible");
        videoPlane.emit("hideVideo");
        
        fadeOutTimeout = setTimeout(() => {
          videoElement.pause();
        }, 500);
      });

      // Зум двома пальцями
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initialDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          baseScale = currentScale;
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialDistance > 0) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          let factor = dist / initialDistance;
          currentScale = Math.max(0.4, Math.min(3.0, baseScale * factor));
          videoPlane.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
        }
      });
    </script>
  </body>
</html>
