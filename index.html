<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оживаюче фото - WebAR</title>
    
    <!-- Підключаємо A-Frame та MindAR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }
        /* Екран завантаження або інструкція */
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 10;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="instructions">Наведіть камеру на фотографію, щоб вона ожила</div>

    <!-- AR с сцена -->
    <script>
        // Компонент для керування відтворенням відео при появі/зникненні таргета
        AFRAME.registerComponent('ar-video-handler', {
            init: function () {
                const target = this.el;
                const video = document.querySelector("#ar-video");

                // Коли маркер (фото) знайдено в кадрі
                target.addEventListener("targetFound", event => {
                    console.log("Таргет знайдено!");
                    video.play();
                });

                // Коли маркер зник з поля зору
                target.addEventListener("targetLost", event => {
                    console.log("Таргет втрачено!");
                    video.pause();
                });
            }
        });
    </script>

    <!-- 
      mindar-image: шлях до вашого файлу .mind (скомпільований таргет)
      renderer: налаштування для коректного відображення кольорів
    -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; smooth: true; smoothCount: 5; smoothTolerance: 0.01; smoothThreshold: 5;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Ваше відео, яке буде "оживляти" фото -->
            <video id="ar-video" src="./video.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Підключаємо обробник до нашого цільового зображення (index: 0 у файлі .mind) -->
        <a-entity mindar-image-target="targetIndex: 0" ar-video-handler>
            <!-- 
              Проєктуємо відео на площину (plane). 
              Ширину та висоту (width/height) налаштовуйте під пропорції вашого реального фото.
            -->
            <a-video src="#ar-video" position="0 0 0" width="1" height="1" rotation="0 0 0"></a-video>
        </a-entity>

    </a-scene>

</body>
</html>
