<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WebAR Фотоальбом</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent !important;
      position: fixed; inset: 0;
      -webkit-tap-highlight-color: transparent;
    }

    a-scene, a-scene canvas, .a-canvas {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      height: 100dvh !important;
      display: block !important;
      background: transparent !important;
    }

    video.mindar-video,
    .mindar-video-container video,
    #ar-camera-video {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      height: 100dvh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      background: #000;
    }

    #loading {
      position: fixed; inset: 0;
      background: #0a0a0a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; color: #fff;
      transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 14px; opacity: 0.7; }

    #start-overlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 60%, #1a1a2e 0%, #0a0a0a 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10000;
      transition: opacity 0.5s ease;
    }
    #start-overlay.hidden { opacity: 0; pointer-events: none; }
    #start-overlay h1 {
      color: #fff; font-size: 22px; font-weight: 600;
      margin: 0 0 8px; text-align: center; padding: 0 24px;
    }
    #start-overlay p {
      color: rgba(255,255,255,0.55); font-size: 14px;
      margin: 0 0 32px; text-align: center; padding: 0 32px;
      line-height: 1.5;
    }
    #start-btn {
      padding: 16px 44px; border: none; border-radius: 50px;
      background: linear-gradient(135deg, #6c63ff, #a855f7);
      color: #fff; font-size: 16px; font-weight: 600;
      box-shadow: 0 8px 32px rgba(108, 99, 255, 0.5);
      cursor: pointer;
    }
    #start-btn:active { transform: scale(0.95); }
    #start-overlay .hint {
      margin-top: 22px; color: rgba(255,255,255,0.35); font-size: 12px;
    }

    #error-msg {
      position: fixed;
      bottom: calc(30px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      background: rgba(220, 38, 38, 0.95); color: #fff;
      padding: 12px 22px; border-radius: 12px;
      font-size: 13px; z-index: 10001;
      display: none; max-width: 85%; text-align: center;
    }
    #error-msg.show { display: block; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p>Завантаження AR…</p>
  </div>

  <div id="start-overlay" class="hidden">
    <h1>AR Фотоальбом</h1>
    <p>Наведіть камеру на фотографію — вона оживе</p>
    <button id="start-btn">▶ Почати</button>
    <div class="hint">Потрібен доступ до камери</div>
  </div>

  <div id="error-msg"></div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 5;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    color-space="sRGB"
    renderer="alpha: true; colorManagement: true; antialias: true; sortObjects: false;"
    embedded
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!--
        Використовуємо a-plane + ВЛАСНИЙ компонент ar-video-texture,
        який гарантовано оновлює текстуру на iOS Safari.
        Розмір площини підлаштовується під пропорції відео.
      -->
      <a-plane
        id="ar-video-plane"
        ar-video-texture="src: https://files.catbox.moe/y5fotd.mp4"
        position="0 0 0"
        width="1"
        height="1"
        rotation="0 0 0"
        material="shader: flat; transparent: true; opacity: 1; side: double;"
      ></a-plane>
    </a-entity>
  </a-scene>

  <script>
    // ============================================================
    // КАСТОМНИЙ A-FRAME КОМПОНЕНТ: ar-video-texture
    // Створює <video>, робить THREE.VideoTexture і оновлює її
    // вручну — це фіксить чорний квадрат на iOS Safari.
    // ============================================================
    AFRAME.registerComponent('ar-video-texture', {
      schema: {
        src: { type: 'string' },
        width: { type: 'number', default: 1 } // базова ширина у світі A-Frame
      },

      init: function () {
        const el = this.el;
        const data = this.data;

        // 1. Створюємо <video> вручну, з усіма потрібними атрибутами для iOS
        const video = document.createElement('video');
        video.setAttribute('src', data.src);
        video.setAttribute('crossorigin', 'anonymous');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('preload', 'auto');
        video.setAttribute('loop', '');
        video.muted = true; // спочатку muted, розблокуємо через кнопку
        video.style.position = 'absolute';
        video.style.left = '-9999px';
        video.style.width = '1px';
        video.style.height = '1px';
        document.body.appendChild(video);

        this.video = video;

        // 2. Чекаємо метадані — дізнаємось реальні пропорції відео
        video.addEventListener('loadedmetadata', () => {
          const vw = video.videoWidth;
          const vh = video.videoHeight;
          if (!vw || !vh) return;

          const aspect = vw / vh;

          // Площина: довша сторона = width зі schema
          // Наприклад width = 1, тоді:
          // - якщо відео горизонтальне: w = 1, h = 1/aspect
          // - якщо вертикальне: w = 1 * aspect, h = 1
          let planeW, planeH;
          if (aspect >= 1) {
            planeW = data.width;
            planeH = data.width / aspect;
          } else {
            planeH = data.width;
            planeW = data.width * aspect;
          }

          el.setAttribute('width', planeW);
          el.setAttribute('height', planeH);
          console.log(`✅ Пропорції відео: ${vw}x${vh} (aspect ${aspect.toFixed(3)}) → ${planeW.toFixed(3)} x ${planeH.toFixed(3)}`);
        });

        // 3. Створюємо THREE.VideoTexture і ПРИВ'ЯЗУЄМО до матеріалу A-Frame
        video.addEventListener('canplay', () => {
          const mesh = el.getObject3D('mesh');
          if (!mesh) return;

          const texture = new THREE.VideoTexture(video);
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;
          texture.format = THREE.RGBAFormat;
          texture.colorSpace = THREE.SRGBColorSpace;

          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            toneMapped: false
          });
          mesh.material = material;

          this.texture = texture;
          console.log('✅ VideoTexture прив\'язана до матеріалу');

          // 4. Запускаємо оновлення текстури кожен кадр — ЦЕ ФІКС для iOS
          this.tick = this.tick.bind(this);
          el.sceneEl.object3D.add(this._dummyTick());
        });

        video.addEventListener('error', (e) => {
          console.error('❌ Помилка відео:', e);
          showError('Не вдалося завантажити відео. Перевірте посилання.');
        });

        // 5. Спроба запустити (може бути заблокована до user gesture)
        video.load();
      },

      // Хак: A-Frame викликає tick() лише у компонентів, що мають цю функцію
      _dummyTick: function () {
        return { tick: () => {} };
      },

      tick: function () {
        // Якщо відео грає, THREE.VideoTexture сама оновлюється,
        // але для iOS Safari потрібно іноді «пінувати» needsUpdate
        if (this.video && !this.video.paused && this.texture) {
          this.texture.needsUpdate = true;
        }
      },

      // Публічні методи — використаємо в основному скрипті
      play: async function () {
        if (!this.video) return;
        try {
          await this.video.play();
        } catch (e) {
          console.warn('play() blocked:', e);
        }
      },

      pause: function () {
        if (this.video) this.video.pause();
      },

      unmute: function () {
        if (this.video) {
          this.video.muted = false;
          this.video.volume = 1.0;
        }
      },

      isPaused: function () {
        return !this.video || this.video.paused;
      }
    });

    // ============================================================
    // ОСНОВНА ЛОГІКА
    // ============================================================
    const loadingEl = document.getElementById('loading');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const errorMsg = document.getElementById('error-msg');
    const sceneEl = document.querySelector('a-scene');
    const videoPlane = document.getElementById('ar-video-plane');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
      setTimeout(() => errorMsg.classList.remove('show'), 6000);
    }

    // Прозорий canvas
    sceneEl.addEventListener('renderstart', () => {
      loadingEl.classList.add('hidden');
      startOverlay.classList.remove('hidden');

      const canvas = sceneEl.canvas;
      if (canvas) {
        canvas.style.background = 'transparent';
        const gl = canvas.getContext('webgl') || canvas.getContext('webgl2');
        if (gl) gl.clearColor(0, 0, 0, 0);
      }
      console.log('✅ Сцена готова');
    });

    // ============================================================
    // СТАРТ: один клік = камера + звук
    // ============================================================
    startBtn.addEventListener('click', async () => {
      startOverlay.classList.add('hidden');

      try {
        // 1. Розблоковуємо відео зі звуком (у межах user gesture)
        const videoComponent = videoPlane.components['ar-video-texture'];
        if (videoComponent) {
          videoComponent.unmute();
          await videoComponent.play();
          videoComponent.pause(); // пауза — гратимемо при знайденні таргету
          console.log('✅ Відео розблоковано зі звуком');
        }

        // 2. Запускаємо MindAR-камеру
        const arSystem = sceneEl.systems['mindar-image-system'];
        if (arSystem) {
          await arSystem.start();
          console.log('✅ Камера запущена');
        }
      } catch (err) {
        console.error('Помилка:', err);
        showError('Дозвольте доступ до камери в налаштуваннях Safari.');
      }
    });

    // ============================================================
    // ТРЕКІНГ
    // ============================================================
    const targetEl = document.querySelector('[mindar-image-target]');

    targetEl.addEventListener('targetFound', async () => {
      console.log('✅ Таргет знайдено');
      const videoComponent = videoPlane.components['ar-video-texture'];
      if (videoComponent && videoComponent.isPaused()) {
        await videoComponent.play();
      }
    });

    targetEl.addEventListener('targetLost', () => {
      console.log('❌ Таргет втрачено');
      const videoComponent = videoPlane.components['ar-video-texture'];
      if (videoComponent) videoComponent.pause();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        const videoComponent = videoPlane.components['ar-video-texture'];
        if (videoComponent) videoComponent.pause();
      }
    });
  </script>
</body>
</html>
