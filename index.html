<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Оживаючий фотоальбом</title>
    <!-- Підключаємо A-Frame та AR.js з CDN -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        .arjs-loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8); display: flex;
            justify-content: center; align-items: center; color: white;
            font-family: sans-serif; z-index: 999;
        }
    </style>
</head>
<body>
    <!-- Індикатор завантаження -->
    <div class="arjs-loader"><div>Завантаження AR, зачекайте...</div></div>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; physicallyCorrectLights: true;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
        <!-- Блок з ресурсами (відео) -->
        <a-assets>
            <!-- Вказуємо пряме посилання на відео. Додано crossorigin для зовнішніх посилань -->
            <video id="video1" src="https://files.catbox.moe/y5fotd.mp4" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
        </a-assets>

        <!-- Маркер: вказуємо назву файлу targets (без розширення .mind) -->
        <a-nft
            type="nft"
            url="targets" 
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
        >
            <!-- Відео, яке буде накладено на маркер -->
            <!-- Співвідношення сторін 16:9 (width=1, height=0.5625) -->
            <!-- Якщо відео вертикальне, змініть на width="0.5625" height="1" -->
            <a-video
                src="#video1"
                position="0 0 0"
                width="1"
                height="0.5625" 
                rotation="-90 0 0"
            ></a-video>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- Скрипт для запуску відео при знаходженні маркера -->
    <script>
        window.onload = function() {
            const videoElement = document.querySelector('#video1');
            const marker = document.querySelector('a-nft');
            const loader = document.querySelector('.arjs-loader');

            // Ховаємо лоадер, коли сцена готова
            document.querySelector('a-scene').addEventListener('loaded', function () {
                loader.style.display = 'none';
            });

            // Відтворення відео при появі маркера
            marker.addEventListener('markerFound', function() {
                videoElement.play().catch(e => {
                    console.log("Помилка автозапуску відео. Потрібна взаємодія користувача:", e);
                });
            });

            // Пауза відео, коли маркер зникає з поля зору
            marker.addEventListener('markerLost', function() {
                videoElement.pause();
                videoElement.currentTime = 0; // Скидаємо відео на початок
            });
        };
    </script>
</body>
</html>
