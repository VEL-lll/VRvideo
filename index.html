<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>AR Video</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
    }

    body {
        position: fixed;
        inset: 0;
    }

    a-scene {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
    }

    #start-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at center,
            rgba(30,30,30,.96),
            rgba(0,0,0,1));
        color: white;
        transition: opacity .35s ease;
    }

    #start-screen.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .start-box {
        width: min(88vw, 420px);
        padding: 30px 24px;
        text-align: center;
        border-radius: 24px;
        background: rgba(20,20,20,.9);
        box-shadow:
            0 20px 70px rgba(0,0,0,.65),
            inset 0 0 0 1px rgba(255,255,255,.08);
    }

    .start-title {
        font-size: 27px;
        font-weight: 700;
        margin-bottom: 12px;
    }

    .start-text {
        font-size: 16px;
        line-height: 1.45;
        opacity: .8;
        margin-bottom: 25px;
    }

    #start-button {
        border: 0;
        outline: 0;
        padding: 15px 28px;
        border-radius: 999px;
        background: white;
        color: black;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
    }

    #status {
        position: fixed;
        z-index: 500;
        top: calc(env(safe-area-inset-top) + 18px);
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(0,0,0,.65);
        color: white;
        font-size: 14px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity .25s ease;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    #status.show {
        opacity: 1;
    }

    #sound-button {
        position: fixed;
        z-index: 600;
        right: 18px;
        bottom: calc(env(safe-area-inset-bottom) + 18px);

        width: 52px;
        height: 52px;

        border: 0;
        border-radius: 50%;

        background: rgba(0,0,0,.65);
        color: white;

        font-size: 22px;

        display: none;
        align-items: center;
        justify-content: center;

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    #sound-button.visible {
        display: flex;
    }

    #error {
        position: fixed;
        z-index: 10000;
        inset: auto 15px 20px 15px;
        display: none;
        padding: 15px;
        border-radius: 15px;
        background: rgba(150,0,0,.9);
        color: white;
        font-size: 14px;
        text-align: center;
    }
</style>
</head>

<body>

<!-- Стартовий екран потрібен тільки для першого user gesture -->
<div id="start-screen">
    <div class="start-box">
        <div class="start-title">AR Video</div>

        <div class="start-text">
            Наведи камеру на фотографію,<br>
            щоб запустити відео.
        </div>

        <button id="start-button">
            Розпочати
        </button>
    </div>
</div>

<div id="status">
    Наведіть камеру на фотографію
</div>

<button id="sound-button">
    🔇
</button>

<div id="error"></div>

<a-scene
    id="ar-scene"

    embedded

    renderer="
        colorManagement: true;
        physicallyCorrectLights: false;
        antialias: true;
        alpha: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    mindar-image="
        imageTargetSrc: targets.mind;

        filterMinCF: 0.0001;
        filterBeta: 0.001;

        warmupTolerance: 3;
        missTolerance: 8;

        uiLoading: no;
        uiScanning: no;
        uiError: no;
    "
>

    <a-assets>

        <video
            id="my-video"

            src="https://files.catbox.moe/y5fotd.mp4"

            preload="auto"

            playsinline
            webkit-playsinline

            crossorigin="anonymous"

            muted
            loop
        ></video>

    </a-assets>


    <!--
        КАМЕРА.
        Нічого вручну не стартуємо.
        MindAR сам керує камерою.
    -->
    <a-camera
        id="main-camera"
        position="0 0 0"
        look-controls="enabled: false"
        wasd-controls="enabled: false"
    ></a-camera>


    <!--
        ГОЛОВНЕ:
        target-entity отримує реальну 3D-позицію
        та 3D-поворот знайденої фотографії.
    -->
    <a-entity
        id="target-entity"
        mindar-image-target="targetIndex: 0"
    >

        <!--
            ВІДЕО Є 3D-ПЛОЩИНОЮ.

            Воно НЕ є HTML-overlay.
            Воно НЕ приклеєне до екрана.

            Воно є дочірнім елементом target-entity,
            тому трансформація фотографії автоматично
            передається відео.
        -->
        <a-plane
            id="video-plane"

            src="#my-video"

            position="0 0 0"

            rotation="0 0 0"

            width="0.75"
            height="1.33"

            material="
                shader: flat;
                transparent: true;
                opacity: 0;
                side: double;
            "

            visible="false"
        ></a-plane>

    </a-entity>

</a-scene>


<script>
(function () {

    "use strict";


    const scene =
        document.getElementById("ar-scene");

    const video =
        document.getElementById("my-video");

    const target =
        document.getElementById("target-entity");

    const videoPlane =
        document.getElementById("video-plane");

    const startScreen =
        document.getElementById("start-screen");

    const startButton =
        document.getElementById("start-button");

    const status =
        document.getElementById("status");

    const soundButton =
        document.getElementById("sound-button");

    const errorBox =
        document.getElementById("error");


    let started = false;
    let targetVisible = false;
    let fadeTimer = null;


    function showStatus(text) {

        status.textContent = text;
        status.classList.add("show");

    }


    function hideStatus() {

        status.classList.remove("show");

    }


    function showError(text) {

        errorBox.textContent = text;
        errorBox.style.display = "block";

    }


    function fadeVideoIn() {

        clearInterval(fadeTimer);

        videoPlane.setAttribute(
            "visible",
            true
        );

        let opacity = 0;

        fadeTimer = setInterval(function () {

            opacity += 0.08;

            if (opacity >= 1) {

                opacity = 1;
                clearInterval(fadeTimer);

            }

            videoPlane.setAttribute(
                "material",
                "opacity",
                opacity
            );

        }, 20);
    }


    function fadeVideoOut() {

        clearInterval(fadeTimer);

        let opacity = 1;

        fadeTimer = setInterval(function () {

            opacity -= 0.1;

            if (opacity <= 0) {

                opacity = 0;

                clearInterval(fadeTimer);

                videoPlane.setAttribute(
                    "visible",
                    false
                );
            }

            videoPlane.setAttribute(
                "material",
                "opacity",
                opacity
            );

        }, 20);
    }


    /*
     * ПЕРШИЙ USER GESTURE
     *
     * Тут ми НЕ запускаємо MindAR вручну.
     * Це важливо.
     *
     * Ми лише розблоковуємо HTML5 video.
     */
    startButton.addEventListener(
        "click",
        async function () {

            try {

                video.muted = true;

                video.currentTime = 0;

                await video.play();

                video.pause();

                started = true;

                startScreen.classList.add("hidden");

                showStatus(
                    "Наведіть камеру на фотографію"
                );

                soundButton.classList.add(
                    "visible"
                );

                setTimeout(function () {

                    startScreen.style.display =
                        "none";

                }, 400);


            } catch (error) {

                console.error(
                    "Video unlock error:",
                    error
                );

                started = true;

                startScreen.classList.add(
                    "hidden"
                );

                soundButton.classList.add(
                    "visible"
                );

                setTimeout(function () {

                    startScreen.style.display =
                        "none";

                }, 400);

            }

        },
        {
            once: true
        }
    );


    /*
     * ЗНАЙДЕНА ФОТОГРАФІЯ
     */
    target.addEventListener(
        "targetFound",
        async function () {

            targetVisible = true;

            hideStatus();

            videoPlane.setAttribute(
                "visible",
                true
            );


            /*
             * Відео завжди відтворюється
             * саме на 3D-площині target.
             */
            try {

                await video.play();

            } catch (error) {

                console.warn(
                    "Video play:",
                    error
                );

            }


            fadeVideoIn();

        }
    );


    /*
     * ФОТОГРАФІЯ ВТРАЧЕНА
     */
    target.addEventListener(
        "targetLost",
        function () {

            targetVisible = false;

            fadeVideoOut();

            video.pause();

            showStatus(
                "Наведіть камеру на фотографію"
            );

        }
    );


    /*
     * КНОПКА ЗВУКУ
     */
    soundButton.addEventListener(
        "click",
        async function () {

            if (video.muted) {

                video.muted = false;

                soundButton.textContent =
                    "🔊";

                try {

                    await video.play();

                } catch (error) {

                    console.warn(error);

                }

            } else {

                video.muted = true;

                soundButton.textContent =
                    "🔇";
            }

        }
    );


    /*
     * Якщо відео закінчиться — воно почнеться
     * з початку. loop також встановлений,
     * це додаткова страховка.
     */
    video.addEventListener(
        "ended",
        function () {

            video.currentTime = 0;

            if (targetVisible) {

                video.play().catch(
                    function () {}
                );

            }

        }
    );


    /*
     * Помилки MindAR / A-Frame
     */
    scene.addEventListener(
        "arError",
        function (event) {

            console.error(
                "AR ERROR:",
                event
            );

            showError(
                "Не вдалося запустити камеру. Перевірте дозвіл на камеру та HTTPS."
            );

        }
    );


    scene.addEventListener(
        "renderstart",
        function () {

            console.log(
                "A-Frame render started"
            );

        }
    );


    /*
     * ВАЖЛИВО:
     *
     * Тут НІЯКОГО:
     *
     * scene.systems["mindar-image-system"].start()
     *
     * MindAR запускає камеру сам через компонент
     * mindar-image.
     */

})();
</script>

</body>
</html>
