<html>
  <head>
    <!-- Метатег для коректного масштабування вебсторінки на мобільних пристроях -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Підключення бібліотеки A-Frame для тривимірного веб-рендерингу (VR/AR) -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <!-- Підключення бібліотеки MindAR для відстеження зображень (Image Tracking) в AR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* Стиль для стартової кнопки, яка знімає обмеження браузера на звук */
      #start-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 15, 20, 0.85);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        cursor: pointer;
        transition: opacity 0.4s ease;
      }
      #start-btn {
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
        color: white;
        border: none;
        padding: 16px 32px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 30px;
        box-shadow: 0 6px 20px rgba(255, 65, 108, 0.4);
        cursor: pointer;
      }
      #start-hint {
        margin-top: 12px;
        font-size: 13px;
        opacity: 0.7;
      }

      /* Мітка версії та номера тесту у нижньому правому кутку */
      #time-badge {
        position: fixed;
        bottom: 12px;
        right: 16px;
        z-index: 9999;
        color: rgba(255, 255, 255, 0.95);
        font-family: monospace;
        font-size: 14px;
        font-weight: bold;
        pointer-events: none;
        letter-spacing: 0.5px;
        text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      }
    </style>
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    
    <!-- Стартовий екран для розблокування звуку на мобільних пристроях -->
    <div id="start-overlay">
      <button id="start-btn">Торкніться для запуску AR</button>
      <div id="start-hint">(потрібно для увімкнення звуку та камери)</div>
    </div>

    <!-- Мітка версії -->
    <div id="time-badge">05:47 | Test #9</div>

    <!-- AR-сцена з оптимізованими параметрами One Euro Filter для ідеального трекінгу під кутами без дрижання -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.0005; filterBeta: 1000; warmupTolerance: 8; missTolerance: 15;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Відео без атрибута loop для точного контролю циклу та анімацій через JS -->
        <video id="my-video" src="https://files.catbox.moe/y5fotd.mp4" preload="auto" response-type="arraybuffer" crossorigin="anonymous" webkit-playsinline playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Сутність AR, яка прив'язується до знайденого маркера -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 
          Відеоплощина з плавними ефектами та ідеальним приляганням до маркера:
          - Початковий стан: зміщене вище (position Y = 0.6), зменшене (scale = 0.5) та повністю прозоре.
          - Поява (showVideo): плавно опускається на своє місце (0 0 0), збільшується і проявляється.
          - Зникнення (hideVideo): відлітає вгору, зменшується і зникає.
          - Перезапуск циклу (videoRestart): ефектна пружинна пульсація при кожному повторі відео.
        -->
        <a-plane id="video-plane" src="#my-video" position="0 0.6 0" height="1.33" width="0.75" 
                 rotation="0 0 0" scale="0.5 0.5 0.5"
                 material="shader: flat; transparent: true; opacity: 0;"
                 
                 animation__fadein="property: material.opacity; to: 1; dur: 800; easing: easeOutCubic; startEvents: showVideo"
                 animation__scalein="property: scale; to: 1 1 1; dur: 1000; easing: easeOutBack; startEvents: showVideo"
                 animation__posin="property: position; to: 0 0 0; dur: 1000; easing: easeOutBack; startEvents: showVideo"
                 
                 animation__fadeout="property: material.opacity; to: 0; dur: 500; easing: easeInCubic; startEvents: hideVideo"
                 animation__scaleout="property: scale; to: 0.5 0.5 0.5; dur: 500; easing: easeInCubic; startEvents: hideVideo"
                 animation__posout="property: position; to: 0 0.6 0; dur: 500; easing: easeInCubic; startEvents: hideVideo"

                 animation__loop="property: scale; from: 1.12 1.12 1.12; to: 1 1 1; dur: 600; easing: easeOutElastic; startEvents: videoRestart">
        </a-plane>
      </a-entity>
      
    </a-scene>

    <script>
      const overlay = document.querySelector("#start-overlay");
      const videoElement = document.querySelector("#my-video");
      const targetEntity = document.querySelector('[mindar-image-target]');
      const videoPlane = document.querySelector("#video-plane");

      let fadeOutTimeout = null;
      let isUnlocked = false;

      // Розблокування звуку за кліком по оверлею
      overlay.addEventListener("click", () => {
        isUnlocked = true;
        
        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.style.display = "none";
        }, 400);

        videoElement.play().then(() => {
          videoElement.pause();
          videoElement.currentTime = 0;
        }).catch(err => console.log("Audio unlock error:", err));
      });

      // Контроль завершення відео та автоматичний перезапуск із пружинним ефектом
      videoElement.addEventListener("ended", () => {
        if (targetEntity.object3D.visible) {
          videoElement.currentTime = 0;
          videoElement.play();
          videoPlane.emit("videoRestart");
        }
      });

      // Подія: знайдено маркер
      targetEntity.addEventListener("targetFound", event => {
        if (!isUnlocked) return;
        
        if (fadeOutTimeout) clearTimeout(fadeOutTimeout);
        
        videoElement.play().catch(err => console.log("Play error:", err));
        videoPlane.emit("showVideo");
      });
      
      // Подія: втрачено маркер
      targetEntity.addEventListener("targetLost", event => {
        if (!isUnlocked) return;
        
        videoPlane.emit("hideVideo");
        
        fadeOutTimeout = setTimeout(() => {
          videoElement.pause();
        }, 500);
      });
    </script>
  </body>
</html>
