<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оживаючий альбом</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        #start {
            position: fixed; inset: 0; z-index: 9999;
            background: #1a1a2e; color: #fff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }
        #start h1 { font-size: 22px; margin-bottom: 10px; }
        #start p { color: #999; margin-bottom: 30px; }
        #start button {
            background: #fff; color: #1a1a2e; border: none;
            padding: 16px 48px; font-size: 18px; font-weight: bold;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <div id="start">
        <h1>📸 Оживаючий альбом</h1>
        <p>Наведіть камеру на фото</p>
        <button id="startBtn">Почати</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: targets.mind; uiLoading: no; uiError: no; uiScanning: no;"
             color-space="sRGB" renderer="alpha: true; antialias: true;"
             vr-mode-ui="enabled: false" embedded
             style="display: none; width: 100vw; height: 100vh;">
        <a-entity mindar-image-target="targetIndex: 0">
            <a-video src="video.mp4" position="0 0 0" width="1" height="0.5625" rotation="-90 0 0"></a-video>
        </a-entity>
        <a-camera position="0 0 0"></a-camera>
    </a-scene>

    <script>
        const startBtn = document.getElementById('startBtn');
        const startScreen = document.getElementById('start');
        const scene = document.querySelector('a-scene');

        startBtn.addEventListener('click', async () => {
            try {
                await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                startScreen.style.display = 'none';
                scene.style.display = 'block';
            } catch (err) {
                alert('Немає доступу до камери: ' + err.message);
            }
        });
    </script>
</body>
</html>
