<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebAR Фотоальбом</title>

  <!-- 1. A-Frame -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- 2. MindAR для A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Елегантний індикатор завантаження */
    #loading {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: #fff;
      transition: opacity 0.8s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading p {
      font-size: 15px;
      letter-spacing: 0.5px;
      opacity: 0.7;
    }

    /* Кнопка запуску (потрібна для автовідтворення відео на мобільних) */
    #start-btn {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      padding: 16px 48px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #6c63ff, #a855f7);
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 32px rgba(108, 99, 255, 0.45);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #start-btn:active {
      transform: translateX(-50%) scale(0.96);
      box-shadow: 0 4px 16px rgba(108, 99, 255, 0.3);
    }
    #start-btn.hidden {
      display: none;
    }

    /* Повідомлення про помилку */
    #error-msg {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(220, 38, 38, 0.95);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 10001;
      display: none;
      max-width: 80%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    #error-msg.show {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Екран завантаження -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Ініціалізація AR…</p>
  </div>

  <!-- Кнопка старту: браузери мобільних вимагають дію користувача для відтворення відео -->
  <button id="start-btn" class="hidden">▶ Відкрити камеру</button>

  <!-- Повідомлення про помилку -->
  <div id="error-msg"></div>

  <!-- AR-сцена -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    embedded
  >
    <!-- Камера -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false;"
    ></a-camera>

    <!-- Цільове зображення (фото з альбому) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Площина з відео, прив'язана до фото -->
      <a-video
        src="#ar-video"
        position="0 0 0"
        width="1"
        height="0.5625"
        rotation="0 0 0"
        autoplay
        muted
        playsinline
        loop
        crossorigin="anonymous"
        material="shader: flat; opacity: 1; side: double;"
        animation="property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 600; easing: easeOutBack;"
      ></a-video>
    </a-entity>
  </a-scene>

  <!-- Прихований відеоелемент-джерело -->
  <video
    id="ar-video"
    src="https://files.catbox.moe/y5fotd.mp4"
    preload="auto"
    crossorigin="anonymous"
    playsinline
    webkit-playsinline
    muted
    loop
    style="display: none;"
  ></video>

  <script>
    // --- Управління екраном завантаження ---
    const loadingEl = document.getElementById('loading');
    const startBtn  = document.getElementById('start-btn');
    const videoEl   = document.getElementById('ar-video');
    const errorMsg  = document.getElementById('error-msg');

    const sceneEl = document.querySelector('a-scene');

    // --- Показ повідомлення про помилку ---
    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.add('show');
      setTimeout(() => errorMsg.classList.remove('show'), 5000);
    }

    // --- Обробка помилок завантаження відео ---
    videoEl.addEventListener('error', (e) => {
      console.error('Помилка завантаження відео:', e);
      showError('Не вдалося завантажити відео. Перевірте з\'єднання або спробуйте інший хостинг.');
    });

    videoEl.addEventListener('loadeddata', () => {
      console.log('✅ Відео успішно завантажено');
    });

    // --- Готовність сцени ---
    sceneEl.addEventListener('renderstart', () => {
      loadingEl.classList.add('hidden');
      startBtn.classList.remove('hidden');
    });

    // --- Запуск камери та відео по кліку ---
    startBtn.addEventListener('click', async () => {
      startBtn.classList.add('hidden');

      try {
        await videoEl.play();

        const arSystem = sceneEl.systems['mindar-image-system'];
        if (arSystem) {
          await arSystem.start();
        }
      } catch (err) {
        console.warn('Помилка запуску:', err);
        showError('Не вдалося запустити камеру або відтворити відео.');
      }
    });

    // --- Обробка подій трекінгу ---
    const targetEl = document.querySelector('[mindar-image-target]');

    targetEl.addEventListener('targetFound', () => {
      console.log('✅ Фото розпізнано — відео відтворюється');
      videoEl.play().catch((err) => {
        console.warn('Автовідтворення заблоковано:', err);
      });
    });

    targetEl.addEventListener('targetLost', () => {
      console.log('❌ Фото втрачено');
      videoEl.pause();
    });

    // --- Пауза відео, якщо вкладку приховано ---
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        videoEl.pause();
      }
    });
  </script>
</body>
</html>
