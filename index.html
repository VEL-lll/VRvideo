<html>
  <head>
    <!-- Метатег для коректного масштабування вебсторінки на мобільних пристроях -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Підключення бібліотеки A-Frame для тривимірного веб-рендерингу (VR/AR) -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <!-- Підключення бібліотеки MindAR для відстеження зображень (Image Tracking) в AR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* Стиль для стартової кнопки, яка знімає обмеження браузера на звук */
      #start-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 15, 20, 0.85);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        cursor: pointer;
        transition: opacity 0.4s ease;
      }
      #start-btn {
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
        color: white;
        border: none;
        padding: 16px 32px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 30px;
        box-shadow: 0 6px 20px rgba(255, 65, 108, 0.4);
        cursor: pointer;
      }
      #start-hint {
        margin-top: 12px;
        font-size: 13px;
        opacity: 0.7;
      }

      /* Стилі для відображення статичного часу-версії у нижньому правому кутку екрана */
      #time-badge {
        position: fixed;       /* Фіксоване положення поверх усього екрана */
        bottom: 8px;           /* Відступ 8 пікселів від нижнього краю */
        right: 12px;           /* Відступ 12 пікселів від правого краю */
        z-index: 9999;         /* Максимальний шар priority, щоб текст був поверх AR-сцени */
        color: rgba(255, 255, 255, 0.7); /* Напівпрозорий білий колір тексту */
        font-family: monospace;/* Моноширинний шрифт для чіткого вигляду */
        font-size: 11px;       /* Невеликий мінімалістичний розмір шрифту */
        pointer-events: none;  /* Клік проходить крізь текст, не блокуючи взаємодію з камерою */
        letter-spacing: 0.5px; /* Легке розрідження між символами */
        text-shadow: 0 1px 2px rgba(0,0,0,0.5); /* Легка тінь для читабельності */
      }
    </style>
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    
    <!-- Стартовий екран для розблокування звуку на мобільних пристроях -->
    <div id="start-overlay">
      <button id="start-btn">Торкніться для запуску AR</button>
      <div id="start-hint">(потрібно для увімкнення звуку та камери)</div>
    </div>

    <!-- Елемент із часом версії збірки (тільки години і хвилини) -->
    <div id="time-badge">05:27</div>

    <!-- 
      Головний контейнер AR-сцени MindAR:
      ДОДАНО параметри стабілізації:
      - filterMinCF & filterBeta: згладжують тремтіння координат та обертань.
      - warmupTolerance: запобігає ривкам при першому знаходженні маркера.
      - missTolerance: утримує стабільність, якщо маркер на мить зникає з кадру.
    -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.0005; filterBeta: 1000; warmupTolerance: 8; missTolerance: 15;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Відео зі звуком, підтримкою циклу та мобільної оптимізації -->
        <video id="my-video" src="https://files.catbox.moe/y5fotd.mp4" preload="auto" response-type="arraybuffer" crossorigin="anonymous" webkit-playsinline playsinline loop></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Сутність AR, яка прив'язується до знайденого маркера -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 
          Ефект голографічного розгортання (шторка + обертання) з правильною пропорцією відео (0.75 x 1.33):
        -->
        <a-plane id="video-plane" src="#my-video" position="0 0 0" height="1.33" width="0.75" 
                 rotation="0 90 0" scale="0.05 0.9 1"
                 material="shader: flat; transparent: true; opacity: 0;"
                 
                 animation__fadein="property: material.opacity; to: 1; dur: 400; easing: easeOutCubic; startEvents: showVideo"
                 animation__scalein="property: scale; to: 1 1 1; dur: 700; easing: easeOutBack; startEvents: showVideo"
                 animation__rotin="property: rotation; to: 0 0 0; dur: 700; easing: easeOutBack; startEvents: showVideo"
                 
                 animation__fadeout="property: material.opacity; to: 0; dur: 300; easing: easeInCubic; startEvents: hideVideo"
                 animation__scaleout="property: scale; to: 0.05 0.9 1; dur: 400; easing: easeInCubic; startEvents: hideVideo"
                 animation__rotout="property: rotation; to: 0 90 0; dur: 400; easing: easeInCubic; startEvents: hideVideo">
        </a-plane>
      </a-entity>
      
    </a-scene>

    <script>
      const overlay = document.querySelector("#start-overlay");
      const videoElement = document.querySelector("#my-video");
      const targetEntity = document.querySelector('[mindar-image-target]');
      const videoPlane = document.querySelector("#video-plane");

      let fadeOutTimeout = null;
      let isUnlocked = false;

      // При натисканні на кнопку оверлею — знімаємо обмеження браузера на аудіо
      overlay.addEventListener("click", () => {
        isUnlocked = true;
        
        // Плавне зникнення стартового вікна
        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.style.display = "none";
        }, 400);

        // Коротка технічна ініціалізація аудіопотоку
        videoElement.play().then(() => {
          videoElement.pause();
          videoElement.currentTime = 0;
        }).catch(err => console.log("Audio unlock error:", err));
      });

      // Подія: коли камера бачить маркер
      targetEntity.addEventListener("targetFound", event => {
        if (!isUnlocked) return;
        
        if (fadeOutTimeout) clearTimeout(fadeOutTimeout);
        
        videoElement.play().catch(err => console.log("Play error:", err));
        videoPlane.emit("showVideo"); // Запуск комбінованої голографічної анімації появи
      });
      
      // Подія: коли маркер зникає з поля зору
      targetEntity.addEventListener("targetLost", event => {
        if (!isUnlocked) return;
        
        videoPlane.emit("hideVideo"); // Запуск згортання та зникнення назад у лінію
        
        fadeOutTimeout = setTimeout(() => {
          videoElement.pause();
        }, 400);
      });
    </script>
  </body>
</html>
