<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оживаючий альбом (MindAR)</title>
    <!-- Підключаємо MindAR та A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.1/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #startButton { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; }
    </style>
</head>
<body>
    <button id="startButton">Почати</button>
    <a-scene mindar-image="imageTargetSrc: targets.mind; uiLoading: no; uiError: no; uiScanning: no;"
             color-space="sRGB" renderer="alpha: true; antialias: true;"
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
        <a-entity mindar-image-target="targetIndex: 0">
            <a-video src="video.mp4" position="0 0 0" width="1" height="0.5625" rotation="-90 0 0"></a-video>
        </a-entity>
        <a-camera position="0 0 0"></a-camera>
    </a-scene>
    <script>
        const startButton = document.getElementById('startButton');
        const scene = document.querySelector('a-scene');
        scene.style.display = 'none'; // Ховаємо сцену до натискання кнопки

        startButton.addEventListener('click', async () => {
            try {
                // Запитуємо доступ до камери
                await navigator.mediaDevices.getUserMedia({ video: true });
                scene.style.display = 'block';
                startButton.style.display = 'none';
            } catch (err) {
                alert('Не вдалося отримати доступ до камери: ' + err.message);
            }
        });
    </script>
</body>
</html>
