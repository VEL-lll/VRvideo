<html>
  <head>
    <!-- Метатег для коректного масштабування вебсторінки на мобільних пристроях -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Підключення бібліотеки A-Frame для тривимірного веб-рендерингу (VR/AR) -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <!-- Підключення бібліотеки MindAR для відстеження зображень (Image Tracking) в AR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* Стилі для відображення статичного часу-версії у нижньому правому кутку екрана */
      #time-badge {
        position: fixed;       /* Фіксоване положення поверх усього екрана */
        bottom: 8px;           /* Відступ 8 пікселів від нижнього краю */
        right: 12px;           /* Відступ 12 пікселів від правого краю */
        z-index: 9999;         /* Максимальний шар priority, щоб текст був поверх AR-сцени */
        color: rgba(255, 255, 255, 0.7); /* Напівпрозорий білий колір тексту */
        font-family: monospace;/* Моноширинний шрифт для чіткого вигляду */
        font-size: 11px;       /* Невеликий мінімалістичний розмір шрифту */
        pointer-events: none;  /* Клік проходить крізь текст, не блокуючи взаємодію з камерою */
        letter-spacing: 0.5px; /* Легке розрідження між символами */
        text-shadow: 0 1px 2px rgba(0,0,0,0.5); /* Легка тінь для читабельності на світлому фоні */
      }
    </style>
  </head>
  
  <!-- Заборона прокрутки сторінки (overflow: hidden) і нульові відступи для повноцінного AR-режиму -->
  <body style="margin: 0; overflow: hidden;">
    
    <!-- Елемент із статичним часом (використовується як версія релізу: тільки години і хвилини) -->
    <div id="time-badge">05:05</div>

    <!-- Головний контейнер AR-сцени MindAR (вказується файл з маркерами targets.mind) -->
    <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <!-- Контейнер для завантаження медіаресурсів (відео) -->
      <a-assets>
        <!-- Оновлене посилання на відео з Catbox із атрибутом loop для циклічного відтворення -->
        <video id="my-video" src="https://files.catbox.moe/y5fotd.mp4" preload="auto" response-type="arraybuffer" crossorigin="anonymous" webkit-playsinline playsinline loop></video>
      </a-assets>

      <!-- Віртуальна камера спостерігача (початкова позиція за замовчуванням) -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Сутність AR, яка прив'язується до знайденого маркера (targetIndex: 0 — перший маркер у файлі) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Відеоплощина: підтримка прозорості, плавного показу (Fade-In/Scale-In) та зникання (Fade-Out/Scale-Out) -->
        <a-plane id="video-plane" src="#my-video" position="0 0 0" height="1.33" width="0.75" rotation="0 0 0" scale="0.9 0.9 0.9"
                 material="shader: flat; transparent: true; opacity: 0;"
                 animation__fadein="property: material.opacity; to: 1; dur: 400; easing: easeOutCubic; startEvents: showVideo"
                 animation__scalein="property: scale; to: 1 1 1; dur: 400; easing: easeOutBack; startEvents: showVideo"
                 animation__fadeout="property: material.opacity; to: 0; dur: 300; easing: easeInCubic; startEvents: hideVideo"
                 animation__scaleout="property: scale; to: 0.9 0.9 0.9; dur: 300; easing: easeInCubic; startEvents: hideVideo">
        </a-plane>
      </a-entity>
      
    </a-scene>

    <script>
      // Отримання посилань на відеоелемент, цільовий маркер AR та відеоплощину з DOM-дерева
      const videoElement = document.querySelector("#my-video");
      const targetEntity = document.querySelector('[mindar-image-target]');
      const videoPlane = document.querySelector("#video-plane");

      let fadeOutTimeout = null;

      // Подія: коли камера бачить маркер — запускається відео та анімація виринання
      targetEntity.addEventListener("targetFound", event => {
        if (fadeOutTimeout) clearTimeout(fadeOutTimeout); // Скасовуємо паузу, якщо маркер знову спіймано
        
        videoElement.play();           // Запускаємо відтворення
        videoPlane.emit("showVideo");  // Активуємо плавне проявлення (Fade-In + Scale-In)
      });
      
      // Подія: коли маркер зникає з поля зору камери — відео плавно зникає
      targetEntity.addEventListener("targetLost", event => {
        videoPlane.emit("hideVideo");  // Активуємо плавне зникання (Fade-Out + Scale-Out)
        
        // Чекаємо завершення анімації (300 мс), після чого ставимо відео на паузу
        fadeOutTimeout = setTimeout(() => {
          videoElement.pause();
        }, 300);
      });
    </script>
  </body>
</html>
