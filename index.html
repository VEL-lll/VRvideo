<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Альбом</title>
    
    <!-- Підключення A-Frame та MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Стильний екран завантаження та підказка */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 20, 0.9);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: ccc solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .instruction {
            position: absolute;
            bottom: 30px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            backdrop-filter: blur(10px);
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- Екран завантаження -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2>Завантаження AR досвіду...</h2>
        <p>Будь ласка, зачекайте</p>
    </div>

    <!-- Інструкція для користувача -->
    <div class="instruction" id="instruction-text">Наведіть камеру на фото в альбомі 📱</div>

    <!-- AR Сцена -->
    <a-scene 
        mindar-image="imageTargetSrc: assets/target.mind; smooth: true; smoothCount: 5; smoothTolerance: 0.01; smoothThreshold: 5;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Підключіть ваше відео (бажано у форматі MP4 з透明ність або просто прямокутне) -->
            <video id="ar-video" src="assets/video.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Посилання на прив'язку до зображення (targetIndex: 0 - перший маркер) -->
        <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
            
            <!-- Площина для відео. Розміри підбираються під пропорції вашого фото (наприклад, 1 на 0.75 для 4:3) -->
            <a-video 
                src="#ar-video" 
                position="0 0 0.02" 
                scale="1 0.75 1" 
                rotation="0 0 0"
                material="shader: flat;">
            </a-video>

            <!-- Необов'язковий стильний контур або рамка навколо відео -->
            <a-plane position="0 0 0" scale="1.05 0.8 1" color="#ffffff" material="shader: flat; opacity: 0.2; transparent: true"></a-plane>

        </a-entity>
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const videoEl = document.querySelector('#ar-video');
        const loadingScreen = document.querySelector('#loading-screen');
        const instructionText = document.querySelector('#instruction-text');
        const targetEntity = document.querySelector('#target-entity');

        // Коли AR-система завантажилась
        sceneEl.addEventListener('renderarget', () => {
            loadingScreen.style.opacity = '0';
            setTimeout(() => loadingScreen.style.display = 'none', 500);
        });

        // Дії при знаходженні фото в кадрі
        targetEntity.addEventListener('targetFound', () => {
            videoEl.play();
            instructionText.innerText = "Відтворення відео...";
        });

        // Дії при втраті фото з поля зору
        targetEntity.addEventListener('targetLost', () => {
            videoEl.pause();
            instructionText.innerText = "Наведіть камеру на фото в альбомі 📱";
        });
    </script>
</body>
</html>
