<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>AR Video Experience</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body {
        margin: 0; 
        overflow: hidden; 
        touch-action: none;
        -webkit-user-select: none; 
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #start-overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 15, 0.95);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        cursor: pointer;
        transition: opacity 0.3s ease;
      }
      #start-btn {
        background: #007aff;
        color: white;
        border: none;
        padding: 16px 32px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 30px;
        box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
        cursor: pointer;
      }
      #start-hint {
        margin-top: 12px;
        font-size: 13px;
        opacity: 0.6;
      }

      #scan-instruction {
        position: fixed;
        top: max(20px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 9998;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 10px 20px;
        border-radius: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 500;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255,255,255,0.1);
      }
      #scan-instruction.visible {
        opacity: 1;
      }

      #action-status {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        z-index: 9999;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        padding: 14px 28px;
        border-radius: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 18px;
        font-weight: bold;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        backdrop-filter: blur(8px);
      }
      #action-status.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      #sound-toggle {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        right: 16px;
        z-index: 19999;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        cursor: pointer;
        backdrop-filter: blur(6px);
      }

      #time-badge {
        position: fixed;
        bottom: max(16px, env(safe-area-inset-bottom));
        right: 16px;
        z-index: 20000;
        color: #ffffff;
        font-family: monospace;
        font-size: 18px;
        font-weight: 900;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.5);
        padding: 6px 12px;
        border-radius: 8px;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      }
    </style>
  </head>
  
  <body oncontextmenu="return false;">
    
    <div id="start-overlay">
      <button id="start-btn">Торкніться для запуску AR</button>
      <div id="start-hint">(потрібно для увімкнення камери та звуку)</div>
    </div>

    <div id="scan-instruction">📍 Наведіть камеру на фото</div>
    <div id="action-status"></div>
    <div id="sound-toggle">🔇</div>
    <div id="time-badge">17.09.2026, 09:05:10</div>

    <!-- Тонко налаштований трекінг для ідеального слідування за обертанням і нахилом фотографії -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 3; missTolerance: 8;" color-space="sRGB" renderer="colorManagement: true; antialias: true; precision: highp;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="my-video" src="https://files.catbox.moe/y5fotd.mp4" preload="auto" crossorigin="anonymous" webkit-playsinline playsinline loop></video>
      </a-assets>

      <a-camera id="main-camera" position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Сувора привязка до цілі без жодних фіксованих компенсацій на камеру -->
      <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
        <a-plane id="video-plane" src="#my-video" position="0 0 0" height="1.33" width="0.75" 
                 rotation="0 0 0" scale="1 1 1"
                 material="shader: flat; transparent: true; opacity: 0;"
                 visible="false">
        </a-plane>
      </a-entity>
      
    </a-scene>

    <script>
      const overlay = document.querySelector("#start-overlay");
      const videoElement = document.querySelector("#my-video");
      const targetEntity = document.querySelector('#target-entity');
      const videoPlane = document.querySelector("#video-plane");
      const scanInstruction = document.querySelector("#scan-instruction");
      const soundToggle = document.querySelector("#sound-toggle");
      const actionStatus = document.querySelector("#action-status");

      let isUnlocked = false;
      let userMuted = false;
      let statusTimeout = null;
      let fadeAnimationId = null;

      function showStatus(text, duration = 1000) {
        actionStatus.textContent = text;
        actionStatus.classList.add("show");
        if (statusTimeout) clearTimeout(statusTimeout);
        if (duration > 0) {
          statusTimeout = setTimeout(() => {
            actionStatus.classList.remove("show");
          }, duration);
        }
      }

      // Плавна анімація появи/зникнення прозорості (Fade-in / Fade-out)
      function animateOpacity(targetOpacity, duration = 600, onComplete) {
        if (fadeAnimationId) cancelAnimationFrame(fadeAnimationId);
        
        const material = videoPlane.components.material;
        if (!material) return;
        
        const startOpacity = material.material.opacity;
        const startTime = performance.now();

        function step(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          
          // Плавна крива easeInOut
          const eased = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;
          const currentOpacity = startOpacity + (targetOpacity - startOpacity) * eased;
          
          material.material.opacity = currentOpacity;
          videoPlane.setAttribute('material', 'opacity', currentOpacity);

          if (progress < 1) {
            fadeAnimationId = requestAnimationFrame(step);
          } else {
            if (onComplete) onComplete();
          }
        }
        fadeAnimationId = requestAnimationFrame(step);
      }

      // Ініціалізація по кліку
      overlay.addEventListener("click", () => {
        if (isUnlocked) return;
        isUnlocked = true;

        overlay.style.opacity = "0";
        setTimeout(() => overlay.style.display = "none", 300);

        scanInstruction.classList.add("visible");
        soundToggle.style.display = "flex";

        videoElement.muted = true;
        videoElement.play().then(() => {
          videoElement.pause();
          videoElement.currentTime = 0;
        }).catch(err => console.log("Init error:", err));
      });

      soundToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        e.preventDefault();
        userMuted = !userMuted;
        videoElement.muted = userMuted;
        soundToggle.textContent = userMuted ? "🔇" : "🔊";
      });

      // Трекінг знайдено: робимо видимим, плавно проявляємо і запускаємо
      targetEntity.addEventListener("targetFound", () => {
        if (!isUnlocked) return;
        scanInstruction.classList.remove("visible");
        
        videoPlane.setAttribute("visible", "true");
        
        videoElement.muted = userMuted;
        videoElement.play().catch(e => console.log("Play error:", e));
        
        animateOpacity(1.0, 700); // Повільна, красива поява
      });
      
      // Трекінг втрачено: плавно гасимо видимість, ставимо на паузу і вимикаємо звук
      targetEntity.addEventListener("targetLost", () => {
        if (!isUnlocked) return;
        scanInstruction.classList.add("visible");
        actionStatus.classList.remove("show");
        
        animateOpacity(0, 500, () => {
          videoPlane.setAttribute("visible", "false");
          videoElement.pause();
          videoElement.muted = true;
        });
      });

      // Перевірка завершення відео для ефекту згасання в кінці
      videoElement.addEventListener('timeupdate', () => {
        if (!videoElement.duration) return;
        const timeLeft = videoElement.duration - videoElement.currentTime;
        // За 0.6 секунди до кінця циклу плавно згашуємо перед повтором/паузою
        if (timeLeft < 0.6 && videoElement.currentTime > 1) {
          // Можна додати мінімальне згасання або залишити безшовний циклічний перехід
        }
      });

      // === ЖЕСТИ (Плавний зум і пауза) ===
      let initialDistance = 0;
      let baseScale = 1;
      let currentScale = 1;
      let touchStartTime = 0;

      window.addEventListener('touchstart', (e) => {
        if (e.target.closest('#sound-toggle')) return;

        if (e.touches.length === 1) {
          touchStartTime = Date.now();
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          initialDistance = Math.hypot(dx, dy);
          baseScale = currentScale;
        }
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault(); 
          
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          
          let factor = dist / initialDistance;
          currentScale = Math.max(0.4, Math.min(3.5, baseScale * factor));
          
          if (videoPlane.object3D) {
            videoPlane.object3D.scale.set(currentScale, currentScale, currentScale);
          }
        }
      }, { passive: false });

      window.addEventListener('touchend', (e) => {
        if (e.target.closest('#sound-toggle')) return;

        if (e.touches.length === 0 && e.changedTouches.length === 1) {
          const touchDuration = Date.now() - touchStartTime;
          if (touchDuration < 300 && videoPlane.getAttribute('visible') === true) {
            if (videoElement.paused) {
              videoElement.play();
              showStatus("▶️ Відтворення");
            } else {
              videoElement.pause();
              showStatus("⏸ Пауза", 0);
            }
          }
        }
      });
    </script>
  </body>
</html>
