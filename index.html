<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #time-badge {
        position: fixed;
        bottom: 8px;
        right: 12px;
        z-index: 9999;
        color: rgba(255, 255, 255, 0.7);
        font-family: monospace;
        font-size: 11px;
        pointer-events: none;
        letter-spacing: 0.5px;
        text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div id="time-badge">--:--</div>

    <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="my-video" src="https://files.catbox.moe/ytgsmo.mp4" preload="auto" response-type="arraybuffer" crossorigin="anonymous" webkit-playsinline playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#my-video" position="0 0 0" height="1.33" width="0.75" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const videoElement = document.querySelector("#my-video");
      const targetEntity = document.querySelector('[mindar-image-target]');
      const timeBadge = document.querySelector("#time-badge");

      function updateTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        timeBadge.textContent = `${hours}:${minutes}`;
      }

      updateTime();
      setInterval(updateTime, 1000);

      targetEntity.addEventListener("targetFound", event => {
        videoElement.play();
      });
      targetEntity.addEventListener("targetLost", event => {
        videoElement.pause();
      });
    </script>
  </body>
</html>
