<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      /* Стиль для акуратного позначення версії знизу */
      #version-badge {
        position: fixed;
        bottom: 8px;
        right: 12px;
        z-index: 9999;
        color: rgba(255, 255, 255, 0.6);
        font-family: monospace;
        font-size: 10px;
        pointer-events: none;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- Позначка версії -->
    <div id="version-badge">v1.0</div>

    <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <!-- Твоє актуальне відео з Catbox -->
        <video id="my-video" src="https://files.catbox.moe/ytgsmo.mp4" preload="auto" response-type="arraybuffer" crossorigin="anonymous" webkit-playsinline playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Стабільний рендеринг відео через a-plane -->
        <a-plane src="#my-video" position="0 0 0" height="1.33" width="0.75" rotation="0 0 0" material="shader: flat;"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      const videoElement = document.querySelector("#my-video");
      const targetEntity = document.querySelector('[mindar-image-target]');

      targetEntity.addEventListener("targetFound", event => {
        videoElement.play();
      });
      targetEntity.addEventListener("targetLost", event => {
        videoElement.pause();
      });
    </script>
  </body>
</html>
