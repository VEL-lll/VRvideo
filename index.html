<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Оживаючий фотоальбом</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        #start-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 24px;
            transition: opacity 0.5s ease;
        }
        #start-screen h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
        #start-screen p { font-size: 15px; color: #aaa; margin-bottom: 32px; max-width: 320px; line-height: 1.5; }
        #start-btn {
            background: #fff; color: #16213e; border: none;
            padding: 16px 48px; font-size: 17px; font-weight: 600;
            border-radius: 50px; cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 8px 24px rgba(255,255,255,0.15);
        }
        #start-btn:active { transform: scale(0.96); }

        #status {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); color: #fff;
            padding: 10px 20px; border-radius: 24px; font-size: 13px;
            display: none; z-index: 100; white-space: nowrap;
        }

        /* Ховаємо всі зайві елементи інтерфейсу */
        .arjs-loader, .a-loader-title, .a-enter-vr,
        .a-enter-ar, .a-orientation-modal, .arjs-debugUI,
        .a-loader, [data-aframe-inspector] { display: none !important; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>📸 Оживаючий альбом</h1>
        <p>Наведіть камеру на фото, щоб побачити відео</p>
        <button id="start-btn">Почати</button>
    </div>

    <div id="status"></div>

    <a-scene
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
        loading-screen="enabled: false"
    >
        <a-assets timeout="20000">
            <video id="video1"
                   src="video.mp4"
                   preload="auto"
                   loop muted playsinline webkit-playsinline></video>
        </a-assets>

        <a-nft
            type="nft"
            url="targets"
            smooth="true"
            smoothCount="5"
            smoothTolerance="0.01"
            smoothThreshold="5"
        >
            <a-video
                src="#video1"
                position="0 0 0"
                width="1"
                height="0.5625"
                rotation="-90 0 0"
            ></a-video>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        (function () {
            const startScreen = document.getElementById('start-screen');
            const startBtn = document.getElementById('start-btn');
            const video = document.getElementById('video1');
            const status = document.getElementById('status');
            let started = false;

            function showStatus(text, timeout = 3000) {
                status.textContent = text;
                status.style.display = 'block';
                if (timeout) setTimeout(() => status.style.display = 'none', timeout);
            }

            video.addEventListener('waiting', () => showStatus('Завантаження відео...', 0));
            video.addEventListener('playing', () => status.style.display = 'none');
            video.addEventListener('error', () => showStatus('❌ Помилка відео', 0));

            startBtn.addEventListener('click', async () => {
                if (started) return;
                started = true;

                // Розблоковуємо відео кліком
                try {
                    video.muted = true;
                    await video.play();
                    video.pause();
                    video.currentTime = 0;
                } catch (err) {
                    console.log('Розблокування:', err);
                }

                startScreen.style.opacity = '0';
                setTimeout(() => startScreen.style.display = 'none', 500);

                showStatus('Готуємо камеру...', 2000);
            });

            const scene = document.querySelector('a-scene');
            scene.addEventListener('loaded', () => {
                const marker = document.querySelector('a-nft');
                if (!marker) return;

                marker.addEventListener('markerFound', () => {
                    if (!started) return;
                    video.muted = false;
                    video.play().catch(err => console.log('Play error:', err));
                });

                marker.addEventListener('markerLost', () => {
                    video.pause();
                    video.currentTime = 0;
                });
            });
        })();
    </script>
</body>
</html>
