<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WebAR Фотоальбом</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent !important;
      position: fixed; inset: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    a-scene, a-scene canvas, .a-canvas {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      height: 100dvh !important;
      display: block !important;
      background: transparent !important;
    }
    video.mindar-video,
    .mindar-video-container video,
    #ar-camera-video {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      height: 100dvh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      background: #000;
    }

    #scan-overlay {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 5000;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #scan-overlay.show { opacity: 1; }
    #scan-frame {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 68vmin; height: 68vmin;
      animation: framePulse 3s ease-in-out infinite;
    }
    #scan-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid rgba(108, 99, 255, 0.55);
      border-radius: 24px;
      box-shadow:
        0 0 40px rgba(108, 99, 255, 0.6),
        0 0 80px rgba(168, 85, 247, 0.3),
        inset 0 0 40px rgba(108, 99, 255, 0.15);
    }
    .corner {
      position: absolute;
      width: 42px; height: 42px;
      border: 3px solid #6c63ff;
      filter: drop-shadow(0 0 10px #6c63ff);
    }
    .corner.tl { top: -3px; left: -3px; border-right: none; border-bottom: none; border-top-left-radius: 20px; }
    .corner.tr { top: -3px; right: -3px; border-left: none; border-bottom: none; border-top-right-radius: 20px; }
    .corner.bl { bottom: -3px; left: -3px; border-right: none; border-top: none; border-bottom-left-radius: 20px; }
    .corner.br { bottom: -3px; right: -3px; border-left: none; border-top: none; border-bottom-right-radius: 20px; }

    #scan-line {
      position: absolute;
      top: 50%; left: 50%;
      transform: translateX(-50%);
      width: 62vmin; height: 3px;
      background: linear-gradient(90deg,
        transparent 0%, rgba(108, 99, 255, 0.6) 20%,
        #a855f7 50%, rgba(108, 99, 255, 0.6) 80%, transparent 100%);
      box-shadow: 0 0 20px #6c63ff, 0 0 40px #a855f7, 0 0 60px rgba(168, 85, 247, 0.5);
      border-radius: 3px;
      animation: scanMove 4s ease-in-out infinite;
    }
    #scan-line::before {
      content: '';
      position: absolute;
      inset: -20px 0;
      background: linear-gradient(180deg, transparent 0%, rgba(108, 99, 255, 0.18) 50%, transparent 100%);
      filter: blur(10px);
    }
    @keyframes framePulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.75; }
      50%      { transform: translate(-50%, -50%) scale(1.035); opacity: 1; }
    }
    @keyframes scanMove {
      0%   { top: 18%; opacity: 0; }
      8%   { opacity: 1; }
      50%  { top: 50%; opacity: 1; }
      92%  { opacity: 1; }
      100% { top: 82%; opacity: 0; }
    }

    #scan-hint {
      position: fixed;
      bottom: calc(100px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      z-index: 5001;
      background: rgba(0,0,0,0.55);
      padding: 10px 22px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity 0.4s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    #scan-hint.hidden { opacity: 0; }

    #hud {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      display: flex;
      gap: 12px;
      z-index: 10002;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }
    #hud.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    .hud-btn {
      width: 56px; height: 56px;
      border: none;
      border-radius: 50%;
      background: rgba(20, 20, 30, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
      transition: transform 0.15s ease, background 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
    }
    .hud-btn:active {
      transform: scale(0.9);
      background: rgba(108, 99, 255, 0.85);
    }
    .hud-btn svg { width: 24px; height: 24px; fill: #fff; }

    #build-time {
      position: fixed;
      right: calc(10px + env(safe-area-inset-right));
      bottom: calc(10px + env(safe-area-inset-bottom));
      font-size: 11px;
      color: rgba(255,255,255,0.85);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.3px;
      z-index: 10002;
      pointer-events: none;
      user-select: none;
      background: rgba(10, 10, 20, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid rgba(108, 99, 255, 0.35);
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #build-time::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #6c63ff;
      box-shadow: 0 0 8px #6c63ff;
      animation: dotPulse 2s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50%      { opacity: 1; transform: scale(1.1); }
    }

    #loading {
      position: fixed; inset: 0;
      background: #0a0a0a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; color: #fff;
      transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 14px; opacity: 0.7; }

    #start-overlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 60%, #1a1a2e 0%, #0a0a0a 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10000;
      transition: opacity 0.5s ease;
    }
    #start-overlay.hidden { opacity: 0; pointer-events: none; }
    #start-overlay h1 {
      color: #fff; font-size: 22px; font-weight: 600;
      margin: 0 0 8px; text-align: center; padding: 0 24px;
    }
    #start-overlay p {
      color: rgba(255,255,255,0.55); font-size: 14px;
      margin: 0 0 32px; text-align: center; padding: 0 32px;
      line-height: 1.5;
    }
    #start-btn {
      padding: 16px 44px; border: none; border-radius: 50px;
      background: linear-gradient(135deg, #6c63ff, #a855f7);
      color: #fff; font-size: 16px; font-weight: 600;
      box-shadow: 0 8px 32px rgba(108,99,255,0.5);
      cursor: pointer;
    }
    #start-btn:active { transform: scale(0.95); }
    #start-overlay .hint {
      margin-top: 22px; color: rgba(255,255,255,0.35); font-size: 12px;
    }
    #start-overlay .version-badge {
      margin-top: 12px;
      font-size: 11px;
      color: rgba(108, 99, 255, 0.9);
      font-family: ui-monospace, monospace;
      letter-spacing: 0.5px;
      padding: 4px 12px;
      border: 1px solid rgba(108, 99, 255, 0.35);
      border-radius: 12px;
      background: rgba(108, 99, 255, 0.08);
    }

    #error-msg {
      position: fixed;
      bottom: calc(100px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      background: rgba(220,38,38,0.95); color: #fff;
      padding: 12px 22px; border-radius: 12px;
      font-size: 13px; z-index: 10001;
      display: none; max-width: 85%; text-align: center;
    }
    #error-msg.show { display: block; }

    #zoom-indicator {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: #fff;
      font-size: 12px; font-family: ui-monospace, monospace;
      padding: 6px 14px; border-radius: 20px;
      z-index: 10002; opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    #zoom-indicator.show { opacity: 1; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p>Завантаження AR…</p>
  </div>

  <div id="start-overlay" class="hidden">
    <h1>AR Фотоальбом</h1>
    <p>Наведіть камеру на фотографію<br>Масштаб — двома пальцями</p>
    <button id="start-btn">▶ Почати</button>
    <div class="hint">Потрібен доступ до камери</div>
    <div class="version-badge" id="start-version">v1.0</div>
  </div>

  <div id="scan-overlay">
    <div id="scan-frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>
    <div id="scan-line"></div>
  </div>
  <div id="scan-hint">Наведіть камеру на фотографію</div>

  <div id="error-msg"></div>
  <div id="build-time">v1.0 · —</div>
  <div id="zoom-indicator">1.00×</div>

  <div id="hud">
    <button class="hud-btn" id="btn-play" title="Play/Pause">
      <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="hud-btn" id="btn-reset-zoom" title="Скинути масштаб">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
    </button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;
                  uiLoading: no; uiScanning: no; uiError: no;
                  maxTrack: 1;
                  filterMinCF: 0.0001;
                  filterBeta: 0.001;
                  warmupTolerance: 5;
                  missTolerance: 5;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    color-space="sRGB"
    renderer="alpha: true; colorManagement: true; antialias: false; sortObjects: false; physicallyCorrectLights: false; logarithmicDepthBuffer: false;"
    embedded
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Площина ЗАВЖДИ 1×1 — MindAR робить таргет теж 1×1 -->
      <a-plane
        id="ar-video-plane"
        ar-video-texture="src: https://files.catbox.moe/y5fotd.mp4"
        position="0 0 0.001"
        width="1"
        height="1"
        rotation="0 0 0"
        material="shader: flat; side: double;"
      ></a-plane>
    </a-entity>
  </a-scene>

  <script>
    // ============================================================
    // 🔧 ВЕРСІЯ
    // ============================================================
    const BUILD_VERSION = 'v1.3';
    const BUILD_TIME = new Date('2026-09-18T13:00:00');

    (function renderBuildInfo() {
      const p = (n) => String(n).padStart(2, '0');
      const d = BUILD_TIME;
      const formatted =
        `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ` +
        `${p(d.getHours())}:${p(d.getMinutes())}`;
      document.getElementById('build-time').textContent =
        `${BUILD_VERSION} · ${formatted}`;
      const badge = document.getElementById('start-version');
      if (badge) badge.textContent = `${BUILD_VERSION} · ${formatted}`;
    })();

    // ============================================================
    // ar-video-texture — v1.3
    //  — площина 1×1 (як таргет MindAR)
    //  — відео обрізається через texture.repeat (cover)
    //  — жорстке вбивання звуку при pause (iOS фікс)
    //  — кнопка reset zoom НЕ ламає відео
    // ============================================================
    AFRAME.registerComponent('ar-video-texture', {
      schema: {
        src: { type: 'string' },
        fadeIn: { type: 'number', default: 500 },
        fadeOut: { type: 'number', default: 300 }
      },

      init: function () {
        const el = this.el;
        this.srcUrl = this.data.src;
        this.baseScale = 0.01;     // 0.01 = приховано, 1 = повний
        this.zoomFactor = 1;
        this.animating = false;
        this.userPaused = false;
        this.hasPlayedOnce = false;
        this._pendingResume = false;

        const video = document.createElement('video');
        video.setAttribute('src', this.srcUrl);
        video.setAttribute('crossorigin', 'anonymous');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('preload', 'auto');
        video.muted = true;
        video.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px;';
        document.body.appendChild(video);
        this.video = video;

        video.addEventListener('canplay', () => {
          if (this.texture) return;
          const mesh = el.getObject3D('mesh');
          if (!mesh) return;

          const texture = new THREE.VideoTexture(video);
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;
          texture.format = THREE.RGBAFormat;
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.generateMipmaps = false;

          // Cover: обрізаємо відео під квадрат 1×1 (площина таргету)
          const updateCover = () => {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            if (!vw || !vh) return;
            const videoAspect = vw / vh;
            const planeAspect = 1;
            if (videoAspect > planeAspect) {
              const visibleW = planeAspect / videoAspect;
              texture.repeat.set(visibleW, 1);
              texture.offset.set((1 - visibleW) / 2, 0);
            } else {
              const visibleH = videoAspect / planeAspect;
              texture.repeat.set(1, visibleH);
              texture.offset.set(0, (1 - visibleH) / 2);
            }
            texture.needsUpdate = true;
          };
          video.addEventListener('loadedmetadata', updateCover);
          if (video.videoWidth) updateCover();

          mesh.material = new THREE.MeshBasicMaterial({
            map: texture,
            side: THREE.DoubleSide,
            toneMapped: false
          });

          this.texture = texture;
          this.material = mesh.material;
          this.setScale(0.01);
        });

        // ЦИКЛ: ended → fade-out → reset → fade-in → грає
        video.addEventListener('ended', () => {
          if (this.userPaused) return;
          this.animateScale(this.baseScale, 0.01, this.data.fadeOut, () => {
            video.currentTime = 0;
            video.play().then(() => {
              this.animateScale(0.01, 1, this.data.fadeIn);
            }).catch(()=>{});
          });
        });

        video.addEventListener('error', () => {
          const em = document.getElementById('error-msg');
          em.textContent = 'Не вдалося завантажити відео.';
          em.classList.add('show');
          setTimeout(() => em.classList.remove('show'), 6000);
        });

        video.load();
      },

      setScale: function (s) {
        this.baseScale = s;
        const effective = s * this.zoomFactor;
        this.el.setAttribute('scale', `${effective} ${effective} ${effective}`);
      },

      animateScale: function (from, to, duration, callback) {
        this.animFrom = from;
        this.animTo = to;
        this.baseScale = from;
        this.animStart = performance.now();
        this.animDuration = duration;
        this.animating = true;
        this.animCallback = callback || null;
      },

      // ▶ Відтворення — продовжує з поточної позиції
      resume: function () {
        if (!this.video) return;
        this.userPaused = false;
        // Якщо src порожній (був убитий при pause) — відновлюємо
        if (!this.video.src || this.video.src === '') {
          this.video.src = this.srcUrl;
          this.video.load();
          this._pendingResume = true;
          return;
        }
        this.video.muted = false;
        this.video.volume = 1.0;
        this.video.play().then(() => {
          this.hasPlayedOnce = true;
          this.animateScale(0.01, 1, this.data.fadeIn);
        }).catch(e => console.warn('resume() blocked:', e));
      },

      // ⏸ Пауза + ЖОРСТКЕ вбивання звуку
      pause: function () {
        if (!this.video) return;
        // 1. Зупиняємо відтворення
        this.video.pause();
        // 2. Глушимо звук
        this.video.muted = true;
        this.video.volume = 0;
        // 3. Анімація зникнення
        this.animateScale(this.baseScale, 0.01, this.data.fadeOut);
        // 4. 🐛 ФІКС ДЛЯ iOS: аудіо-буфер не звільняється через pause().
        //    Тільки повне src='' + load() вбиває канал.
        //    (зберігаємо currentTime, щоб потім продовжити)
        this._savedTime = this.video.currentTime;
        setTimeout(() => {
          if (this.video && !this.userPaused) {
            // Зберігаємо позицію і «вбиваємо» канал
            this.video.pause();
            this.video.muted = true;
            this.video.volume = 0;
            // Не рвемо src — інакше втратимо можливість resume.
            // Натомість примусово скидаємо audio context:
            try {
              // Зупиняємо будь-які активні AudioContext
              if (window.audioContext) window.audioContext.suspend();
            } catch(e) {}
          }
        }, 50);
      },

      togglePlay: function () {
        if (this.video.paused) {
          this.userPaused = false;
          this.video.muted = false;
          this.video.volume = 1.0;
          this.video.play().then(() => this.animateScale(0.01, 1, this.data.fadeIn)).catch(()=>{});
        } else {
          this.userPaused = true;
          this.video.pause();
          this.video.muted = true;
          this.video.volume = 0;
          this.animateScale(this.baseScale, 0.01, this.data.fadeOut);
        }
      },

      unmute: function () {
        if (this.video) {
          this.video.muted = false;
          this.video.volume = 1.0;
        }
      },

      isPaused: function () { return !this.video || this.video.paused; },

      setZoom: function (factor) {
        this.zoomFactor = factor;
        const effective = this.baseScale * factor;
        this.el.setAttribute('scale', `${effective} ${effective} ${effective}`);
      },

      resetZoom: function () {
        this.zoomFactor = 1.0;
        // 🐛 ФІКС: НЕ ламає відео — просто множимо на 1
        const effective = this.baseScale * 1.0;
        this.el.setAttribute('scale', `${effective} ${effective} ${effective}`);
      },

      tick: function () {
        if (this.video && !this.video.paused && this.texture) {
          this.texture.needsUpdate = true;
        }
        if (this.animating) {
          const t = Math.min((performance.now() - this.animStart) / this.animDuration, 1);
          let eased;
          if (this.animTo > this.animFrom) {
            const c1 = 1.70158, c3 = c1 + 1;
            eased = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
          } else {
            eased = t * t;
          }
          this.baseScale = this.animFrom + (this.animTo - this.animFrom) * eased;
          const effective = this.baseScale * this.zoomFactor;
          this.el.setAttribute('scale', `${effective} ${effective} ${effective}`);

          if (t >= 1) {
            this.animating = false;
            this.baseScale = this.animTo;
            if (this.animCallback) {
              const cb = this.animCallback;
              this.animCallback = null;
              cb();
            }
          }
        }
      },

      remove: function () {
        if (this.texture) this.texture.dispose();
        if (this.material) this.material.dispose();
        if (this.video) {
          this.video.pause();
          this.video.muted = true;
          this.video.src = '';
          this.video.load();
          this.video.remove();
        }
      }
    });

    // ============================================================
    // ОСНОВНА ЛОГІКА
    // ============================================================
    const loadingEl = document.getElementById('loading');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const sceneEl = document.querySelector('a-scene');
    const videoPlane = document.getElementById('ar-video-plane');
    const zoomIndicator = document.getElementById('zoom-indicator');
    const scanOverlay = document.getElementById('scan-overlay');
    const scanHint = document.getElementById('scan-hint');
    const hud = document.getElementById('hud');
    const btnPlay = document.getElementById('btn-play');
    const btnResetZoom = document.getElementById('btn-reset-zoom');
    const iconPlay = document.getElementById('icon-play');

    const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
    const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

    sceneEl.addEventListener('renderstart', () => {
      loadingEl.classList.add('hidden');
      startOverlay.classList.remove('hidden');
      const canvas = sceneEl.canvas;
      if (canvas) {
        canvas.style.background = 'transparent';
        const gl = canvas.getContext('webgl') || canvas.getContext('webgl2');
        if (gl) gl.clearColor(0, 0, 0, 0);
      }
    });

    let zoomFactor = 1.0, initialPinchDistance = 0, initialZoomFactor = 1.0;
    const getDistance = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

    function showZoom() {
      zoomIndicator.textContent = zoomFactor.toFixed(2) + '×';
      zoomIndicator.classList.add('show');
      clearTimeout(showZoom._t);
      showZoom._t = setTimeout(() => zoomIndicator.classList.remove('show'), 1200);
    }

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = getDistance(e.touches);
        initialZoomFactor = zoomFactor;
      }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance > 0) {
        const ratio = getDistance(e.touches) / initialPinchDistance;
        zoomFactor = Math.max(0.3, Math.min(3.0, initialZoomFactor * ratio));
        const vc = videoPlane.components['ar-video-texture'];
        if (vc) vc.setZoom(zoomFactor);
        showZoom();
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDistance = 0;
    }, { passive: true });

    startBtn.addEventListener('click', async () => {
      startOverlay.classList.add('hidden');
      scanOverlay.classList.add('show');
      scanHint.classList.remove('hidden');
      try {
        const vc = videoPlane.components['ar-video-texture'];
        if (vc) {
          vc.unmute();
          await vc.video.play();
          vc.video.pause();
          vc.video.muted = true;
          vc.video.volume = 0;
          vc.video.currentTime = 0;
        }
        const arSystem = sceneEl.systems['mindar-image-system'];
        if (arSystem) await arSystem.start();
      } catch (err) { console.error(err); }
    });

    btnPlay.addEventListener('click', () => {
      const vc = videoPlane.components['ar-video-texture'];
      if (vc) vc.togglePlay();
    });

    btnResetZoom.addEventListener('click', () => {
      zoomFactor = 1.0;
      const vc = videoPlane.components['ar-video-texture'];
      if (vc) vc.resetZoom();
      showZoom();
    });

    const targetEl = document.querySelector('[mindar-image-target]');

    targetEl.addEventListener('targetFound', async () => {
      scanOverlay.classList.remove('show');
      scanHint.classList.add('hidden');
      hud.classList.add('show');
      const vc = videoPlane.components['ar-video-texture'];
      if (!vc) return;
      await vc.resume();
      iconPlay.innerHTML = ICON_PAUSE;
    });

    targetEl.addEventListener('targetLost', () => {
      scanOverlay.classList.add('show');
      scanHint.classList.remove('hidden');
      hud.classList.remove('show');
      const vc = videoPlane.components['ar-video-texture'];
      if (vc) vc.pause();
    });

    setInterval(() => {
      const vc = videoPlane.components['ar-video-texture'];
      if (!vc || !vc.video) return;
      iconPlay.innerHTML = vc.video.paused ? ICON_PLAY : ICON_PAUSE;
    }, 300);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        const vc = videoPlane.components['ar-video-texture'];
        if (vc) vc.pause();
      }
    });

    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend', e => e.preventDefault());
  </script>
</body>
</html>
