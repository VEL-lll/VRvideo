<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WebAR Фотоальбом</title>

<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;position:fixed;inset:0;-webkit-tap-highlight-color:transparent;touch-action:none}
  a-scene,.a-canvas{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;background:transparent!important;display:block!important}
  video.mindar-video,.mindar-video-container video{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;object-fit:cover!important;z-index:0!important;background:#000}

  #scan{position:fixed;inset:0;pointer-events:none;z-index:100;opacity:0;transition:opacity .5s}
  #scan.show{opacity:1}
  #scan .frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:66vmin;height:66vmin;animation:pulse 3s ease-in-out infinite}
  #scan .frame::before{content:'';position:absolute;inset:0;border:2px solid rgba(108,99,255,.5);border-radius:22px;box-shadow:0 0 40px rgba(108,99,255,.6),inset 0 0 40px rgba(108,99,255,.15)}
  #scan .c{position:absolute;width:40px;height:40px;border:3px solid #6c63ff;filter:drop-shadow(0 0 8px #6c63ff)}
  #scan .tl{top:-3px;left:-3px;border-right:0;border-bottom:0;border-top-left-radius:18px}
  #scan .tr{top:-3px;right:-3px;border-left:0;border-bottom:0;border-top-right-radius:18px}
  #scan .bl{bottom:-3px;left:-3px;border-right:0;border-top:0;border-bottom-left-radius:18px}
  #scan .br{bottom:-3px;right:-3px;border-left:0;border-top:0;border-bottom-right-radius:18px}
  #scan .line{position:absolute;top:50%;left:50%;transform:translateX(-50%);width:60vmin;height:3px;background:linear-gradient(90deg,transparent,rgba(108,99,255,.7),#a855f7,rgba(108,99,255,.7),transparent);box-shadow:0 0 20px #6c63ff,0 0 40px #a855f7;border-radius:3px;animation:scanMove 3.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.75}50%{transform:translate(-50%,-50%) scale(1.04);opacity:1}}
  @keyframes scanMove{0%{top:20%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:80%;opacity:0}}

  #hud{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);display:flex;gap:12px;z-index:200;opacity:0;transition:.4s;pointer-events:none}
  #hud.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .btn{width:56px;height:56px;border:0;border-radius:50%;background:rgba(20,20,30,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.4)}
  .btn:active{transform:scale(.9);background:rgba(108,99,255,.85)}
  .btn svg{width:24px;height:24px;fill:#fff}

  #start{position:fixed;inset:0;background:radial-gradient(circle at 50% 60%,#1a1a2e,#0a0a0a);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5000;font-family:system-ui;transition:opacity .5s}
  #start.hide{opacity:0;pointer-events:none}
  #start h1{color:#fff;font-size:22px;font-weight:600;margin:0 0 8px}
  #start p{color:rgba(255,255,255,.55);font-size:14px;margin:0 0 32px;text-align:center;line-height:1.5;padding:0 32px}
  #start button{padding:16px 44px;border:0;border-radius:50px;background:linear-gradient(135deg,#6c63ff,#a855f7);color:#fff;font-size:16px;font-weight:600;box-shadow:0 8px 32px rgba(108,99,255,.5);cursor:pointer}
  #start button:active{transform:scale(.95)}
  #start button:disabled{opacity:.5;cursor:not-allowed}
  #start .ver{margin-top:20px;font-size:11px;color:rgba(108,99,255,.8);font-family:monospace}
  #start .status{margin-top:10px;font-size:11px;color:rgba(255,255,255,.5);font-family:monospace;height:14px}

  #hint{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#fff;font-size:14px;background:rgba(0,0,0,.6);padding:10px 22px;border-radius:20px;z-index:150;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .4s;pointer-events:none;white-space:nowrap}
  #hint.hide{opacity:0}

  #zoom{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-family:monospace;padding:6px 14px;border-radius:20px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
  #zoom.show{opacity:1}

  #build{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));font-size:11px;color:rgba(255,255,255,.7);font-family:monospace;background:rgba(10,10,20,.6);padding:5px 10px;border-radius:8px;border:1px solid rgba(108,99,255,.3);z-index:200;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
</style>
</head>
<body>

<div id="start">
  <h1>AR Фотоальбом</h1>
  <p>Наведіть камеру на фотографію<br>Масштаб — двома пальцями</p>
  <button id="start-btn" disabled>▶ Почати</button>
  <div class="status" id="status">Завантаження відео…</div>
  <div class="ver" id="ver">v7.0</div>
</div>

<div id="scan">
  <div class="frame">
    <div class="c tl"></div><div class="c tr"></div>
    <div class="c bl"></div><div class="c br"></div>
  </div>
  <div class="line"></div>
</div>

<div id="hint" class="hide">Наведіть камеру на фотографію</div>
<div id="zoom">1.00×</div>
<div id="build">v7.0</div>

<div id="hud">
  <button class="btn" id="btn-play">
    <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <button class="btn" id="btn-reset">
    <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
  </button>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 10; missTolerance: 10;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  color-space="sRGB"
  renderer="alpha: true; colorManagement: true; antialias: false; sortObjects: false;"
  embedded>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0">
    <a-plane id="ar-plane"
             width="1" height="1"
             position="0 0 0.001"
             rotation="0 0 0"
             material="shader: flat; side: double; transparent: true;"
             visible="false"
             scale="0.01 0.01 0.01"></a-plane>
  </a-entity>
</a-scene>

<video id="vid"
  src="https://files.catbox.moe/y5fotd.mp4"
  playsinline webkit-playsinline muted crossorigin="anonymous" preload="auto"
  style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none"></video>

<script>
// ============================================================
// КОНФІГ
// ============================================================
const VERSION = 'v7.0';
const ZOOM_MIN = 0.3, ZOOM_MAX = 3.0;
const FADE_IN_MS = 700, FADE_OUT_MS = 500;

(function(){
  const d = new Date(); const p = n => String(n).padStart(2,'0');
  const s = `${VERSION} · ${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  document.getElementById('build').textContent = s;
  document.getElementById('ver').textContent = s;
})();

// ============================================================
// ЕЛЕМЕНТИ
// ============================================================
const video = document.getElementById('vid');
const plane = document.getElementById('ar-plane');
const sceneEl = document.querySelector('a-scene');
const startScreen = document.getElementById('start');
const startBtn = document.getElementById('start-btn');
const statusEl = document.getElementById('status');
const scan = document.getElementById('scan');
const hint = document.getElementById('hint');
const hud = document.getElementById('hud');
const zoomInd = document.getElementById('zoom');
const btnPlay = document.getElementById('btn-play');
const btnReset = document.getElementById('btn-reset');
const iconPlay = document.getElementById('icon-play');
const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

// ============================================================
// СТАН
// ============================================================
let targetVisible = false;
let videoReady = false;
let zoomFactor = 1.0;
let initialPinch = 0, initialZoom = 1.0;
let anim = null;
let texture = null;

video.muted = true; video.volume = 0;

// ============================================================
// 1. ЗАВАНТАЖЕННЯ ВІДЕО
// ============================================================
video.addEventListener('loadedmetadata', () => {
  const aspect = video.videoWidth / video.videoHeight;
  console.log(`✅ Відео: ${video.videoWidth}×${video.videoHeight}`);
  applyCover(aspect);
});

video.addEventListener('canplaythrough', () => {
  if (videoReady) return;
  videoReady = true;
  startBtn.disabled = false;
  statusEl.textContent = '✅ Готово до старту';
}, { once: true });

video.addEventListener('progress', () => {
  if (!videoReady && video.buffered.length > 0 && video.duration) {
    const pct = Math.round((video.buffered.end(0) / video.duration) * 100);
    statusEl.textContent = `Завантаження… ${pct}%`;
  }
});

video.load();

// ============================================================
// 2. COVER
// ============================================================
function applyCover(aspect) {
  if (!texture) { setTimeout(() => applyCover(aspect), 100); return; }
  if (aspect > 1) {
    const w = 1 / aspect;
    texture.repeat.set(w, 1);
    texture.offset.set((1 - w) / 2, 0);
  } else {
    const h = aspect;
    texture.repeat.set(1, h);
    texture.offset.set(0, (1 - h) / 2);
  }
  texture.needsUpdate = true;
}

// ============================================================
// 3. VideoTexture
// ============================================================
function setupTexture() {
  const mesh = plane.getObject3D('mesh');
  if (!mesh) { requestAnimationFrame(setupTexture); return; }
  if (texture) return;

  texture = new THREE.VideoTexture(video);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.format = THREE.RGBAFormat;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.generateMipmaps = false;

  const material = new THREE.MeshBasicMaterial({
    map: texture, side: THREE.DoubleSide,
    toneMapped: false, transparent: true
  });
  mesh.material = material;

  console.log('✅ VideoTexture прив\'язана');

  if (video.videoWidth && video.videoHeight) {
    applyCover(video.videoWidth / video.videoHeight);
  }

  (function tick(){
    requestAnimationFrame(tick);
    if (texture && video.readyState >= 2 && !video.ended) texture.needsUpdate = true;
  })();
}

// ============================================================
// 4. АНІМАЦІЯ SCALE
// ============================================================
function animateScale(from, to, dur, cb) {
  anim = { from, to, start: performance.now(), dur, cb: cb || null };
}

(function tickScale(now){
  requestAnimationFrame(tickScale);
  if (!anim) return;
  const t = Math.min((now - anim.start) / anim.dur, 1);
  let eased;
  if (anim.to > anim.from) {
    const c1 = 1.70158, c3 = c1 + 1;
    eased = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  } else {
    eased = t * t;
  }
  const s = (anim.from + (anim.to - anim.from) * eased) * zoomFactor;
  plane.setAttribute('scale', `${s} ${s} ${s}`);
  if (t >= 1) {
    const cb = anim.cb; anim = null;
    if (cb) cb();
  }
})();

// ============================================================
// 5. ЦИКЛ
// ============================================================
video.addEventListener('ended', () => {
  if (!targetVisible) return;
  animateScale(1, 0.01, FADE_OUT_MS, () => {
    video.currentTime = 0;
    video.play().then(() => animateScale(0.01, 1, FADE_IN_MS)).catch(e=>{});
  });
});

// ============================================================
// 6. СТАРТ
// ============================================================
sceneEl.addEventListener('renderstart', () => {
  const canvas = sceneEl.canvas;
  if (canvas) {
    canvas.style.background = 'transparent';
    const gl = canvas.getContext('webgl') || canvas.getContext('webgl2');
    if (gl) gl.clearColor(0, 0, 0, 0);
  }
  setupTexture();
});

startBtn.addEventListener('click', async () => {
  startScreen.classList.add('hide');
  scan.classList.add('show');
  hint.classList.remove('hide');

  try {
    video.muted = false; video.volume = 1;
    await video.play();
    video.pause();
    video.currentTime = 0;

    video.muted = true; video.volume = 0;
    await video.play();
  } catch (e) { console.warn('unlock:', e); }

  const sys = sceneEl.systems['mindar-image-system'];
  if (sys) await sys.start();
});

// ============================================================
// 7. ТРЕКІНГ
// ============================================================
const targetEl = document.querySelector('[mindar-image-target]');

targetEl.addEventListener('targetFound', () => {
  targetVisible = true;
  scan.classList.remove('show');
  hint.classList.add('hide');
  hud.classList.add('show');

  const show = () => {
    if (video.readyState < 2) { requestAnimationFrame(show); return; }
    plane.setAttribute('visible', 'true');
    animateScale(0.01, 1, FADE_IN_MS);
  };
  show();

  video.muted = false; video.volume = 1;
  if (video.paused) video.play().catch(e=>{});

  iconPlay.innerHTML = ICON_PAUSE;
});

targetEl.addEventListener('targetLost', () => {
  targetVisible = false;
  scan.classList.add('show');
  hint.classList.remove('hide');
  hud.classList.remove('show');

  video.muted = true; video.volume = 0;

  animateScale(1, 0.01, FADE_OUT_MS, () => {
    if (targetVisible) return;
    plane.setAttribute('visible', 'false');
    setTimeout(() => { if (!targetVisible) video.pause(); }, 80);
  });
});

// ============================================================
// 8. КНОПКИ
// ============================================================
btnPlay.addEventListener('click', () => {
  if (!targetVisible) return;
  if (video.paused) {
    video.muted = false; video.volume = 1;
    video.play().catch(()=>{});
  } else {
    video.muted = true; video.volume = 0;
    video.pause();
  }
});

btnReset.addEventListener('click', () => {
  zoomFactor = 1.0;
  const s = 1;
  plane.setAttribute('scale', `${s} ${s} ${s}`);
  showZoom();
});

setInterval(() => {
  iconPlay.innerHTML = (!video.paused && targetVisible) ? ICON_PAUSE : ICON_PLAY;
}, 300);

// ============================================================
// 9. ZOOM
// ============================================================
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

function showZoom() {
  zoomInd.textContent = zoomFactor.toFixed(2) + '×';
  zoomInd.classList.add('show');
  clearTimeout(showZoom._t);
  showZoom._t = setTimeout(() => zoomInd.classList.remove('show'), 1200);
}

document.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    initialPinch = dist(e.touches);
    initialZoom = zoomFactor;
  }
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && initialPinch > 0) {
    const ratio = dist(e.touches) / initialPinch;
    zoomFactor = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, initialZoom * ratio));
    const s = (anim ? anim.to : 1) * zoomFactor;
    plane.setAttribute('scale', `${s} ${s} ${s}`);
    showZoom();
  }
}, { passive: true });

document.addEventListener('touchend', e => {
  if (e.touches.length < 2) initialPinch = 0;
}, { passive: true });

// ============================================================
// 10. ФОН
// ============================================================
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    video.muted = true; video.volume = 0;
  } else if (targetVisible) {
    video.muted = false; video.volume = 1;
    if (video.paused) video.play().catch(()=>{});
  }
});

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
</script>
</body>
</html>
