<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Оживаючий фотоальбом</title>

    <!-- MindAR + A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Екран запуску */
        #start-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 24px;
            transition: opacity 0.4s ease;
        }
        #start-screen.hidden { opacity: 0; pointer-events: none; }
        #start-screen h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
        #start-screen p { font-size: 15px; color: #aaa; margin-bottom: 32px; max-width: 320px; line-height: 1.5; }
        #start-btn {
            background: #fff; color: #16213e; border: none;
            padding: 16px 48px; font-size: 17px; font-weight: 600;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 8px 24px rgba(255,255,255,0.15);
            transition: transform 0.15s ease;
        }
        #start-btn:active { transform: scale(0.96); }

        /* Підказка наведення на фото */
        #hint {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: #fff;
            padding: 10px 20px; border-radius: 24px; font-size: 14px;
            z-index: 100; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* Статус */
        #status {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); color: #fff;
            padding: 10px 20px; border-radius: 24px; font-size: 13px;
            display: none; z-index: 100; white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>📸 Оживаючий альбом</h1>
        <p>Наведіть камеру на фото, щоб побачити відео</p>
        <button id="start-btn">Почати</button>
    </div>

    <div id="hint" style="display:none;">Наведіть камеру на фото</div>
    <div id="status"></div>

    <a-scene
        mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights: true, antialias: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false"
    >
        <a-assets timeout="20000">
            <video id="video1"
                   src="video.mp4"
                   preload="auto"
                   loop muted playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-video
                src="#video1"
                position="0 0 0"
                width="1"
                height="0.5625"
                rotation="-90 0 0"
            ></a-video>
        </a-entity>
    </a-scene>

    <script>
        (function () {
            const startScreen = document.getElementById('start-screen');
            const startBtn = document.getElementById('start-btn');
            const video = document.getElementById('video1');
            const status = document.getElementById('status');
            const hint = document.getElementById('hint');
            let started = false;

            function showStatus(text, timeout = 3000) {
                status.textContent = text;
                status.style.display = 'block';
                if (timeout) setTimeout(() => status.style.display = 'none', timeout);
            }

            video.addEventListener('error', () => {
                showStatus('❌ Помилка завантаження відео', 0);
            });

            startBtn.addEventListener('click', async () => {
                if (started) return;
                started = true;

                try {
                    // Розблоковуємо відео кліком (для автоплею у Safari)
                    video.muted = true;
                    await video.play();
                    video.pause();
                    video.currentTime = 0;
                } catch (err) {
                    console.log('Розблокування відео:', err);
                }

                // Ховаємо екран запуску і показуємо підказку
                startScreen.classList.add('hidden');
                setTimeout(() => startScreen.style.display = 'none', 400);
                hint.style.display = 'block';

                // Запускаємо MindAR
                const sceneEl = document.querySelector('a-scene');
                const arSystem = sceneEl.systems['mindar-image-system'];
                if (arSystem) {
                    arSystem.start();
                } else {
                    sceneEl.addEventListener('renderstart', () => {
                        sceneEl.systems['mindar-image-system'].start();
                    });
                }
            });

            // Обробники знаходження/втрати маркера
            const sceneEl = document.querySelector('a-scene');
            sceneEl.addEventListener('renderstart', () => {
                const target = document.querySelector('[mindar-image-target]');
                if (!target) return;

                target.addEventListener('targetFound', () => {
                    if (!started) return;
                    hint.style.display = 'none';
                    video.muted = false;
                    video.play().catch(err => console.log('Play error:', err));
                });

                target.addEventListener('targetLost', () => {
                    video.pause();
                    video.currentTime = 0;
                    hint.style.display = 'block';
                });
            });
        })();
    </script>
</body>
</html>
