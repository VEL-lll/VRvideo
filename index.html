<html>
  <head>
    <!-- Метатег для коректного масштабування на мобільних -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Підключення A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <!-- Підключення MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* Статична мітка версії у правому нижньому кутку */
      #time-badge {
        position: fixed;
        bottom: 8px;
        right: 12px;
        z-index: 9999;
        color: rgba(255, 255, 255, 0.7);
        font-family: monospace;
        font-size: 11px;
        pointer-events: none;
        letter-spacing: 0.5px;
        text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      }
    </style>
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    
    <!-- Версія / час збірки -->
    <div id="time-badge">05:15</div>

    <!-- AR-сцена -->
    <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- ДОДАНО "muted": це обов'язково для мобільних браузерів, інакше autoplay блокується -->
        <video id="my-video" src="https://files.catbox.moe/y5fotd.mp4" preload="auto" response-type="arraybuffer" crossorigin="anonymous" webkit-playsinline playsinline muted loop></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Контейнер маркера -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Відеоплощина з чіткішою анімацією появи та зникнення -->
        <a-plane id="video-plane" src="#my-video" position="0 0 0" height="1.33" width="0.75" rotation="0 0 0" scale="0.7 0.7 0.7"
                 material="shader: flat; transparent: true; opacity: 0;"
                 animation__fadein="property: material.opacity; to: 1; dur: 500; easing: easeOutCubic; startEvents: showVideo"
                 animation__scalein="property: scale; to: 1 1 1; dur: 500; easing: easeOutBack; startEvents: showVideo"
                 animation__fadeout="property: material.opacity; to: 0; dur: 300; easing: easeInCubic; startEvents: hideVideo"
                 animation__scaleout="property: scale; to: 0.7 0.7 0.7; dur: 300; easing: easeInCubic; startEvents: hideVideo">
        </a-plane>
      </a-entity>
      
    </a-scene>

    <script>
      const videoElement = document.querySelector("#my-video");
      const targetEntity = document.querySelector('[mindar-image-target]');
      const videoPlane = document.querySelector("#video-plane");

      let fadeOutTimeout = null;

      // Коли маркер знайдено камерою
      targetEntity.addEventListener("targetFound", event => {
        if (fadeOutTimeout) clearTimeout(fadeOutTimeout);
        
        videoElement.play().catch(err => console.log("Play error:", err));
        videoPlane.emit("showVideo"); // Запуск помітної анімації появи та збільшення
      });
      
      // Коли маркер втрачено з поля зору
      targetEntity.addEventListener("targetLost", event => {
        videoPlane.emit("hideVideo"); // Запуск плавного зникнення
        
        fadeOutTimeout = setTimeout(() => {
          videoElement.pause();
        }, 300);
      });
    </script>
  </body>
</html>
