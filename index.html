<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>WebAR Фотоальбом</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* Мінімум CSS — решту MindAR робить сам */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      height: 100%;
      width: 100%;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #start-overlay.hidden { display: none; }

    #start-btn {
      padding: 18px 52px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #6c63ff, #a855f7);
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(108, 99, 255, 0.5);
    }
  </style>
</head>
<body>

  <!-- Оверлей з кнопкою запуску -->
  <div id="start-overlay">
    <button id="start-btn">▶ Відкрити камеру</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <!-- Відео-джерело -->
    <a-assets>
      <video id="ar-video"
             src="./video.mp4"
             preload="auto"
             muted
             autoplay
             loop
             crossorigin="anonymous"
             webkit-playsinline
             playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video src="#ar-video"
               position="0 0 0"
               height="1"
               width="1"
               rotation="0 0 0"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl   = document.querySelector('a-scene');
    const overlay   = document.getElementById('start-overlay');
    const videoEl   = document.getElementById('ar-video');

    // Логи для діагностики (дивіться в Safari → Розробка → [iPhone])
    videoEl.addEventListener('loadeddata', () => console.log('✅ Відео завантажено'));
    videoEl.addEventListener('error', (e) => console.error('❌ Помилка відео:', e));
    videoEl.addEventListener('playing', () => console.log('▶ Відео відтворюється'));
    videoEl.addEventListener('pause', () => console.log('⏸ Відео на паузі'));

    // Клік по кнопці — запускає і камеру, і відео
    overlay.addEventListener('click', async () => {

      // 1. Запускаємо відео ПЕРЕД камерою (вимога iOS)
      try {
        videoEl.muted = true;
        videoEl.playsInline = true;
        await videoEl.play();
        console.log('✅ video.play() успішно');
      } catch (err) {
        console.error('❌ video.play() не спрацював:', err);
      }

      // 2. Запускаємо MindAR
      try {
        sceneEl.systems['mindar-image-system'].start();
        console.log('✅ Камера запущена');
      } catch (err) {
        console.error('❌ Помилка камери:', err);
      }

      overlay.classList.add('hidden');
    });

    // Події трекінгу
    const targetEl = document.querySelector('[mindar-image-target]');

    targetEl.addEventListener('targetFound', () => {
      console.log('🎯 Таргет знайдено');
      videoEl.play().catch(err => console.warn('play() blocked:', err));
    });

    targetEl.addEventListener('targetLost', () => {
      console.log('🚫 Таргет втрачено');
      videoEl.pause();
    });
  </script>
</body>
</html>
