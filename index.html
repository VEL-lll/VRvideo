<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      #start-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 15, 20, 0.85);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        cursor: pointer;
        transition: opacity 0.4s ease;
      }
      #start-btn {
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
        color: white;
        border: none;
        padding: 16px 32px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 30px;
        box-shadow: 0 6px 20px rgba(255, 65, 108, 0.4);
        cursor: pointer;
      }
      #start-hint {
        margin-top: 12px;
        font-size: 13px;
        opacity: 0.7;
      }

      /* Підказка для сканування (зникає при знаходженні маркера) */
      #scan-instruction {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9998;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px 20px;
        border-radius: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 500;
        pointer-events: none;
        transition: opacity 0.4s ease, transform 0.4s ease;
        opacity: 0;
        letter-spacing: 0.3px;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255,255,255,0.15);
      }
      #scan-instruction.visible {
        opacity: 1;
      }

      /* Кнопка керування звуком (Mute/Unmute) */
      #sound-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: none; /* З'явиться після запуску AR */
        align-items: center;
        justify-content: center;
        font-size: 18px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: background 0.2s;
      }
      #sound-toggle:active {
        background: rgba(255, 255, 255, 0.3);
      }

      /* Метка часу та версії */
      #time-badge {
        position: fixed;
        bottom: 12px;
        right: 16px;
        z-index: 9999;
        color: rgba(255, 255, 255, 0.95);
        font-family: monospace;
        font-size: 14px;
        font-weight: bold;
        pointer-events: none;
        letter-spacing: 0.5px;
        text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      }
    </style>
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    
    <!-- Стартовий екран -->
    <div id="start-overlay">
      <button id="start-btn">Торкніться для запуску AR</button>
      <div id="start-hint">(потрібно для увімкнення звуку та камери)</div>
    </div>

    <!-- Інтерактивна підказка -->
    <div id="scan-instruction">📍 Наведіть камеру на зображення</div>

    <!-- Кнопка звуку -->
    <div id="sound-toggle">🔇</div>

    <!-- Мітка часу (тільки час і хвилини) -->
    <div id="time-badge">07:11 | Test #18</div>

    <!-- Ультрашвидкий та стабільний трекінг -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.01; filterBeta: 2000; warmupTolerance: 3; missTolerance: 5;" color-space="sRGB" renderer="colorManagement: true; antialias: false; precision: mediump; physicallyCorrectLights: false;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="my-video" src="https://files.catbox.moe/y5fotd.mp4" preload="auto" response-type="arraybuffer" crossorigin="anonymous" webkit-playsinline playsinline loop muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane id="video-plane" src="#my-video" position="0 0 0" height="1.33" width="0.75" 
                 rotation="0 0 0" scale="1 1 1"
                 material="shader: flat; transparent: true; opacity: 0;"
                 
                 animation__fadein="property: material.opacity; to: 1; dur: 1200; easing: easeInOutCubic; startEvents: showVideo"
                 animation__fadeout="property: material.opacity; to: 0; dur: 800; easing: easeInOutCubic; startEvents: hideVideo">
        </a-plane>
      </a-entity>
      
    </a-scene>

    <script>
      const overlay = document.querySelector("#start-overlay");
      const videoElement = document.querySelector("#my-video");
      const targetEntity = document.querySelector('[mindar-image-target]');
      const videoPlane = document.querySelector("#video-plane");
      const scanInstruction = document.querySelector("#scan-instruction");
      const soundToggle = document.querySelector("#sound-toggle");

      let fadeOutTimeout = null;
      let isUnlocked = false;

      // Розблокування за кліком
      overlay.addEventListener("click", () => {
        isUnlocked = true;
        videoElement.muted = false;

        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.style.display = "none";
        }, 400);

        // Показуємо підказку сканування та кнопку звуку
        scanInstruction.classList.add("visible");
        soundToggle.style.display = "flex";
        soundToggle.textContent = "🔊";

        videoElement.play().then(() => {
          videoElement.pause();
          videoElement.currentTime = 0;
        }).catch(err => console.log("Audio unlock error:", err));
      });

      // Перемикач звуку
      soundToggle.addEventListener("click", () => {
        videoElement.muted = !videoElement.muted;
        soundToggle.textContent = videoElement.muted ? "🔇" : "🔊";
      });

      // Знайдено маркер
      targetEntity.addEventListener("targetFound", event => {
        if (!isUnlocked) return;
        if (fadeOutTimeout) clearTimeout(fadeOutTimeout);
        
        scanInstruction.classList.remove("visible"); // ховаємо підказку під час перегляду
        videoElement.play().catch(err => console.log("Play error:", err));
        videoPlane.emit("showVideo");
      });
      
      // Втрачено маркер
      targetEntity.addEventListener("targetLost", event => {
        if (!isUnlocked) return;
        
        scanInstruction.classList.add("visible"); // повертаємо підказку пошуку
        videoPlane.emit("hideVideo");
        fadeOutTimeout = setTimeout(() => {
          videoElement.pause();
        }, 800);
      });
    </script>
  </body>
</html>
