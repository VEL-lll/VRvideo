<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WebAR Фотоальбом</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent !important;
      position: fixed; inset: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    a-scene, a-scene canvas, .a-canvas {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      height: 100dvh !important;
      display: block !important;
      background: transparent !important;
    }

    video.mindar-video,
    .mindar-video-container video,
    #ar-camera-video {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      height: 100dvh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      background: #000;
    }

    /* === ІНДИКАТОР ЧАСУ ОНОВЛЕННЯ (збільшений) === */
    #build-time {
      position: fixed;
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(10px + env(safe-area-inset-bottom));
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      color: rgba(255, 255, 255, 0.85);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.4px;
      z-index: 10002;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.8);
      user-select: none;
    }

    #loading {
      position: fixed; inset: 0;
      background: #0a0a0a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; color: #fff;
      transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 14px; opacity: 0.7; }

    #start-overlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 60%, #1a1a2e 0%, #0a0a0a 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10000;
      transition: opacity 0.5s ease;
    }
    #start-overlay.hidden { opacity: 0; pointer-events: none; }
    #start-overlay h1 {
      color: #fff; font-size: 22px; font-weight: 600;
      margin: 0 0 8px; text-align: center; padding: 0 24px;
    }
    #start-overlay p {
      color: rgba(255,255,255,0.55); font-size: 14px;
      margin: 0 0 32px; text-align: center; padding: 0 32px;
      line-height: 1.5;
    }
    #start-btn {
      padding: 16px 44px; border: none; border-radius: 50px;
      background: linear-gradient(135deg, #6c63ff, #a855f7);
      color: #fff; font-size: 16px; font-weight: 600;
      box-shadow: 0 8px 32px rgba(108, 99, 255, 0.5);
      cursor: pointer;
    }
    #start-btn:active { transform: scale(0.95); }
    #start-overlay .hint {
      margin-top: 22px; color: rgba(255,255,255,0.35); font-size: 12px;
    }

    #error-msg {
      position: fixed;
      bottom: calc(30px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      background: rgba(220, 38, 38, 0.95); color: #fff;
      padding: 12px 22px; border-radius: 12px;
      font-size: 13px; z-index: 10001;
      display: none; max-width: 85%; text-align: center;
    }
    #error-msg.show { display: block; }

    #zoom-indicator {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 12px;
      font-family: ui-monospace, monospace;
      padding: 6px 14px;
      border-radius: 20px;
      z-index: 10002;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    #zoom-indicator.show { opacity: 1; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p>Завантаження AR…</p>
  </div>

  <div id="start-overlay" class="hidden">
    <h1>AR Фотоальбом</h1>
    <p>Наведіть камеру на фотографію — вона оживе<br>Можна масштабувати двома пальцями</p>
    <button id="start-btn">▶ Почати</button>
    <div class="hint">Потрібен доступ до камери</div>
  </div>

  <div id="error-msg"></div>
  <div id="build-time">оновлено: —</div>
  <div id="zoom-indicator">1.0×</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;
                  uiLoading: no;
                  uiScanning: no;
                  uiError: no;
                  maxTrack: 1;
                  filterMinCF: 0.00001;
                  filterBeta: 0.0005;
                  warmupTolerance: 10;
                  missTolerance: 10;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    color-space="sRGB"
    renderer="alpha: true; colorManagement: true; antialias: true; sortObjects: false; physicallyCorrectLights: false;"
    embedded
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane
        id="ar-video-plane"
        ar-video-texture="src: https://files.catbox.moe/y5fotd.mp4"
        position="0 0 0"
        width="1"
        height="1"
        rotation="0 0 0"
        material="shader: flat; transparent: true; opacity: 0; side: double;"
      ></a-plane>
    </a-entity>
  </a-scene>

  <script>
    // ============================================================
    // ІНДИКАТОР ЧАСУ ОНОВЛЕННЯ
    // ============================================================
    (function setBuildTime() {
      const BUILD_TIME = new Date(); // для релізу замініть на фіксовану дату
      const pad = (n) => String(n).padStart(2, '0');
      const d = BUILD_TIME;
      const formatted =
        `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ` +
        `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      document.getElementById('build-time').textContent = 'оновлено: ' + formatted;
    })();

    // ============================================================
    // КАСТОМНИЙ КОМПОНЕНТ: ar-video-texture
    // ============================================================
    AFRAME.registerComponent('ar-video-texture', {
      schema: {
        src: { type: 'string' },
        width: { type: 'number', default: 1 },
        fadeDuration: { type: 'number', default: 400 }
      },

      init: function () {
        const el = this.el;
        const data = this.data;

        this.opacity = 0;
        this.targetOpacity = 0;
        this.scaleTarget = 1;
        this.currentScale = 1;
        this.fadeStart = 0;
        this.fadeFrom = 0;
        this.fadeTo = 0;
        this.fading = false;
        this._needsFadeIn = false;

        const video = document.createElement('video');
        video.setAttribute('src', data.src);
        video.setAttribute('crossorigin', 'anonymous');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('preload', 'auto');
        video.setAttribute('loop', 'false');
        video.muted = true;
        video.style.position = 'absolute';
        video.style.left = '-9999px';
        video.style.width = '1px';
        video.style.height = '1px';
        document.body.appendChild(video);

        this.video = video;

        video.addEventListener('loadedmetadata', () => {
          const vw = video.videoWidth;
          const vh = video.videoHeight;
          if (!vw || !vh) return;

          const aspect = vw / vh;
          let planeW, planeH;
          if (aspect >= 1) {
            planeW = data.width;
            planeH = data.width / aspect;
          } else {
            planeH = data.width;
            planeW = data.width * aspect;
          }
          this.baseW = planeW;
          this.baseH = planeH;
          el.setAttribute('width', planeW);
          el.setAttribute('height', planeH);
          console.log(`✅ Пропорції відео: ${vw}x${vh} → ${planeW.toFixed(3)} x ${planeH.toFixed(3)}`);
        });

        video.addEventListener('canplay', () => {
          if (this.texture) return;
          const mesh = el.getObject3D('mesh');
          if (!mesh) return;

          const texture = new THREE.VideoTexture(video);
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;
          texture.format = THREE.RGBAFormat;
          texture.colorSpace = THREE.SRGBColorSpace;

          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            toneMapped: false,
            opacity: 0
          });
          mesh.material = material;

          this.texture = texture;
          this.material = material;
          console.log('✅ VideoTexture прив\'язана');
        });

        video.addEventListener('ended', () => {
          console.log('🔁 Відео закінчилось — цикл');
          this.fadeOutThenRestart();
        });

        video.addEventListener('error', () => {
          showError('Не вдалося завантажити відео. Перевірте посилання.');
        });

        video.load();
      },

      fadeIn: function (duration) {
        duration = duration || this.data.fadeDuration;
        this.fadeFrom = this.opacity;
        this.fadeTo = 1;
        this.fadeStart = performance.now();
        this.fadeDuration = duration;
        this.fading = true;
        this._needsFadeIn = true;
        this.currentScale = 0.85;
        this.scaleTarget = 1;
      },

      fadeOut: function (duration, callback) {
        duration = duration || this.data.fadeDuration;
        this.fadeFrom = this.opacity;
        this.fadeTo = 0;
        this.fadeStart = performance.now();
        this.fadeDuration = duration;
        this.fading = true;
        this._fadeOutCallback = callback;
      },

      fadeOutThenRestart: function () {
        this.fadeOut(300, () => {
          this.video.currentTime = 0;
          this.video.play().catch(() => {});
          this.fadeIn(400);
        });
      },

      play: async function () {
        if (!this.video) return;
        try {
          await this.video.play();
          this.fadeIn();
        } catch (e) {
          console.warn('play() blocked:', e);
        }
      },

      pause: function () {
        if (this.video) this.video.pause();
        this.fadeOut(250);
      },

      unmute: function () {
        if (this.video) {
          this.video.muted = false;
          this.video.volume = 1.0;
        }
      },

      isPaused: function () {
        return !this.video || this.video.paused;
      },

      setZoom: function (factor) {
        if (!this.baseW || !this.baseH) return;
        this.scaleTarget = factor;
      },

      tick: function (time, delta) {
        if (this.video && !this.video.paused && this.texture) {
          this.texture.needsUpdate = true;
        }

        if (this.fading) {
          const elapsed = performance.now() - this.fadeStart;
          const t = Math.min(elapsed / this.fadeDuration, 1);
          const eased = 1 - Math.pow(1 - t, 3);
          this.opacity = this.fadeFrom + (this.fadeTo - this.fadeFrom) * eased;

          if (this.material) {
            this.material.opacity = this.opacity;
            this.material.transparent = this.opacity < 1 || this.fadeTo < 1;
          }

          if (t >= 1) {
            this.fading = false;
            if (this._fadeOutCallback) {
              const cb = this._fadeOutCallback;
              this._fadeOutCallback = null;
              cb();
            }
          }
        }

        const scaleDelta = this.scaleTarget - this.currentScale;
        if (Math.abs(scaleDelta) > 0.001) {
          this.currentScale += scaleDelta * Math.min(delta / 100, 1) * 0.3;
          if (this.baseW && this.baseH) {
            this.el.setAttribute('width', this.baseW * this.currentScale);
            this.el.setAttribute('height', this.baseH * this.currentScale);
          }
        }
      },

      remove: function () {
        if (this.texture) this.texture.dispose();
        if (this.material) this.material.dispose();
        if (this.video) {
          this.video.pause();
          this.video.src = '';
          this.video.load();
          this.video.remove();
        }
      }
    });

    // ============================================================
    // ОСНОВНА ЛОГІКА
    // ============================================================
    const loadingEl = document.getElementById('loading');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const errorMsg = document.getElementById('error-msg');
    const sceneEl = document.querySelector('a-scene');
    const videoPlane = document.getElementById('ar-video-plane');
    const zoomIndicator = document.getElementById('zoom-indicator');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
      setTimeout(() => errorMsg.classList.remove('show'), 6000);
    }

    sceneEl.addEventListener('renderstart', () => {
      loadingEl.classList.add('hidden');
      startOverlay.classList.remove('hidden');

      const canvas = sceneEl.canvas;
      if (canvas) {
        canvas.style.background = 'transparent';
        const gl = canvas.getContext('webgl') || canvas.getContext('webgl2');
        if (gl) gl.clearColor(0, 0, 0, 0);
      }
      console.log('✅ Сцена готова');
    });

    // ============================================================
    // PINCH-TO-ZOOM (двома пальцями)
    // ============================================================
    let zoomFactor = 1.0;
    let initialPinchDistance = 0;
    let initialZoomFactor = 1.0;

    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function showZoomIndicator() {
      zoomIndicator.textContent = zoomFactor.toFixed(2) + '×';
      zoomIndicator.classList.add('show');
      clearTimeout(showZoomIndicator._t);
      showZoomIndicator._t = setTimeout(() => {
        zoomIndicator.classList.remove('show');
      }, 1200);
    }

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = getDistance(e.touches);
        initialZoomFactor = zoomFactor;
      }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance > 0) {
        const currentDistance = getDistance(e.touches);
        const ratio = currentDistance / initialPinchDistance;
        zoomFactor = Math.max(0.3, Math.min(3.0, initialZoomFactor * ratio));

        const videoComponent = videoPlane.components['ar-video-texture'];
        if (videoComponent) {
          videoComponent.setZoom(zoomFactor);
        }
        showZoomIndicator();
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = 0;
      }
    }, { passive: true });

    // ============================================================
    // СТАРТ
    // ============================================================
    startBtn.addEventListener('click', async () => {
      startOverlay.classList.add('hidden');

      try {
        const videoComponent = videoPlane.components['ar-video-texture'];
        if (videoComponent) {
          videoComponent.unmute();
          await videoComponent.play();
          videoComponent.pause();
          console.log('✅ Відео розблоковано зі звуком');
        }

        const arSystem = sceneEl.systems['mindar-image-system'];
        if (arSystem) {
          await arSystem.start();
          console.log('✅ Камера запущена');
        }
      } catch (err) {
        console.error('Помилка:', err);
        showError('Дозвольте доступ до камери в налаштуваннях Safari.');
      }
    });

    // ============================================================
    // ТРЕКІНГ + LERP-ЗГЛАДЖУВАННЯ
    // ============================================================
    const targetEl = document.querySelector('[mindar-image-target]');

    let lastTick = performance.now();
    let smoothMatrix = new THREE.Matrix4();
    let smoothInitialized = false;
    const SMOOTHING = 0.35;

    function smoothTick() {
      requestAnimationFrame(smoothTick);
      const now = performance.now();
      const delta = (now - lastTick) / 1000;
      lastTick = now;

      const obj = targetEl.object3D;
      if (!obj) return;

      if (!smoothInitialized) {
        smoothMatrix.copy(obj.matrix);
        smoothInitialized = true;
        return;
      }

      const cur = obj.matrix.elements;
      const sm = smoothMatrix.elements;
      const k = 1 - Math.pow(1 - SMOOTHING, delta * 60);

      for (let i = 0; i < 16; i++) {
        sm[i] = sm[i] + (cur[i] - sm[i]) * k;
      }
    }
    smoothTick();

    targetEl.addEventListener('targetFound', async () => {
      console.log('✅ Таргет знайдено');
      const videoComponent = videoPlane.components['ar-video-texture'];
      if (videoComponent) {
        if (videoComponent.isPaused()) {
          videoComponent.video.currentTime = 0;
          await videoComponent.play();
        } else {
          videoComponent.fadeIn();
        }
      }
      showZoomIndicator();
    });

    targetEl.addEventListener('targetLost', () => {
      console.log('❌ Таргет втрачено');
      const videoComponent = videoPlane.components['ar-video-texture'];
      if (videoComponent) videoComponent.pause();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        const videoComponent = videoPlane.components['ar-video-texture'];
        if (videoComponent) videoComponent.pause();
      }
    });

    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    document.addEventListener('gestureend', (e) => e.preventDefault());
  </script>
</body>
</html>
